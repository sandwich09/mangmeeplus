name: Production Deploy V2
run-name: Promote READY ${{ inputs.readiness_run_id || 'inline' }} → ${{ inputs.requested_serving_mode }}

on:
  workflow_dispatch:
    inputs:
      uat_run_id:
        description: Exact successful UAT run that issued UAT Release Passport V2
        required: true
        type: string
      readiness_run_id:
        description: Exact successful Production Readiness V2 run; leave empty to prove READY in this run
        required: false
        type: string
      requested_serving_mode:
        description: Must exactly match the signed READY certificate
        required: true
        default: maintenance_closed
        type: choice
        options:
          - maintenance_closed
          - live
      owner_legal_override_ref:
        description: Owner approval reference for an auditable live legal-evidence override (inline READY only)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: watchdog-bms-production-deploy
  cancel-in-progress: false

jobs:
  # One dispatch, one signed chain. The reusable call runs the same readiness job with the same
  # steps, so the Fulcio subject stays production-readiness.yml@refs/heads/main and the artifact is
  # named for THIS run. Supplying readiness_run_id skips this job and consumes a standalone READY
  # exactly as before — the rollback path needs no code revert.
  readiness:
    name: Prove Production READY inside this promotion run
    if: inputs.readiness_run_id == ''
    uses: ./.github/workflows/production-readiness.yml
    with:
      uat_run_id: ${{ inputs.uat_run_id }}
      requested_serving_mode: ${{ inputs.requested_serving_mode }}
      owner_legal_override_ref: ${{ inputs.owner_legal_override_ref }}
    secrets: inherit

  promote:
    name: Promote exact UAT Passport through signed Production READY
    needs: readiness
    if: >-
      !cancelled() &&
      (inputs.readiness_run_id != '' || needs.readiness.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    env:
      AWS_ACCOUNT_ID: '311414082667'
      AWS_REGION: ap-southeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      DEPLOYMENT_POLL_ATTEMPTS: '75'
      DEPLOY_ENV: production
      ECS_DEPLOY_MANAGE_IAM: 'false'
      ECR_REGISTRY: 311414082667.dkr.ecr.ap-southeast-1.amazonaws.com
      PUBLIC_DOMAIN_URL: ${{ vars.PUBLIC_DOMAIN_URL }}
      SES_FROM_ADDRESS: ${{ vars.SES_FROM_ADDRESS || 'contact@mangmeeplus.com' }}
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      LINE_LIFF_ID: ${{ vars.LINE_LIFF_ID }}
      LINE_MESSAGING_CHANNEL_ID: ${{ vars.LINE_MESSAGING_CHANNEL_ID }}
      WEB_LINE_ACCOUNT_LINK_URL: ${{ vars.WEB_LINE_ACCOUNT_LINK_URL }}
      LINE_OA_ADD_URL: ${{ vars.LINE_OA_ADD_URL }}
      LINE_OA_QR_IMAGE_URL: ${{ vars.LINE_OA_QR_IMAGE_URL }}
      LINE_ACCOUNT_LINK_QR_IMAGE_URL: ${{ vars.LINE_ACCOUNT_LINK_QR_IMAGE_URL }}
      CRM_AUTO_REPLY_ENABLED: ${{ vars.CRM_AUTO_REPLY_ENABLED }}
      CRM_AI_MIN_CONFIDENCE: ${{ vars.CRM_AI_MIN_CONFIDENCE }}
      CRM_AI_OUTBOUND_ALLOWED_DOMAINS: ${{ vars.CRM_AI_OUTBOUND_ALLOWED_DOMAINS || 'mangmeeplus.com' }}
      WORKFLOW_WEBHOOK_ALLOWED_HOSTS: ${{ vars.WORKFLOW_WEBHOOK_ALLOWED_HOSTS }}
      CLAMAV_HOST: ${{ vars.CLAMAV_HOST }}
      CLAMAV_PORT: ${{ vars.CLAMAV_PORT || '3310' }}
      CLAMAV_TIMEOUT_MS: ${{ vars.CLAMAV_TIMEOUT_MS || '5000' }}
      LOG_RETENTION_DAYS: ${{ vars.LOG_RETENTION_DAYS || '14' }}
      LOG_KMS_KEY_ID: ${{ vars.LOG_KMS_KEY_ID }}
      SECURITY_ALERT_TOPIC_ARN: ${{ vars.SECURITY_ALERT_TOPIC_ARN }}
      AI_DATA_RETENTION_DAYS: ${{ vars.AI_DATA_RETENTION_DAYS || '90' }}
      AI_LLM_MAX_PER_COMPANY: ${{ vars.AI_LLM_MAX_PER_COMPANY || '60' }}
      AI_OCR_MAX_PER_COMPANY: ${{ vars.AI_OCR_MAX_PER_COMPANY || '20' }}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.AI_RATE_LIMIT_WINDOW_SECONDS || '60' }}
      AI_THB_PER_USD: ${{ vars.AI_THB_PER_USD || '33' }}
      AI_MONTHLY_BUDGET_SATANG: ${{ vars.AI_MONTHLY_BUDGET_SATANG || '200000' }}
      AI_MONTHLY_BUDGET_SATANG_CEILING: ${{ vars.AI_MONTHLY_BUDGET_SATANG_CEILING || '1000000' }}
      PASSWORD_RESET_RESPONSE_MIN_MS: ${{ vars.PASSWORD_RESET_RESPONSE_MIN_MS || '300' }}
      SESSION_REFRESH_MAX_PER_SESSION: ${{ vars.SESSION_REFRESH_MAX_PER_SESSION || '30' }}
      SESSION_REFRESH_WINDOW_SECONDS: ${{ vars.SESSION_REFRESH_WINDOW_SECONDS || '60' }}
      SESSION_REFRESH_REUSE_GRACE_SECONDS: ${{ vars.SESSION_REFRESH_REUSE_GRACE_SECONDS || '30' }}
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      APPROVED_AI_PROVIDERS: ${{ vars.APPROVED_AI_PROVIDERS }}
      APPROVED_AI_REGIONS: ${{ vars.APPROVED_AI_REGIONS }}
      AI_GLOBAL_INFERENCE_PROFILE_APPROVED: ${{ vars.AI_GLOBAL_INFERENCE_PROFILE_APPROVED }}
      AI_GLOBAL_INFERENCE_PROFILE_APPROVAL_REF: ${{ vars.AI_GLOBAL_INFERENCE_PROFILE_APPROVAL_REF }}
      OPENAI_PROCESSING_REGION: ${{ vars.OPENAI_PROCESSING_REGION }}
      TYPHOON_PROCESSING_REGION: ${{ vars.TYPHOON_PROCESSING_REGION }}
      BEDROCK_REGION: ${{ vars.BEDROCK_REGION }}
      LINE_AI_AGENT_RUNTIME: ${{ vars.LINE_AI_AGENT_RUNTIME }}
      AGENTCORE_REGION: ${{ vars.AGENTCORE_REGION }}
      AGENTCORE_INVOKE_TIMEOUT_MS: ${{ vars.AGENTCORE_INVOKE_TIMEOUT_MS }}
      AGENTCORE_MAX_BODY_BYTES: ${{ vars.AGENTCORE_MAX_BODY_BYTES || '1048576' }}
      AGENTCORE_MAX_MESSAGE_CHARS: ${{ vars.AGENTCORE_MAX_MESSAGE_CHARS || '8000' }}
      AGENTCORE_MAX_ATTACHMENTS: ${{ vars.AGENTCORE_MAX_ATTACHMENTS || '10' }}
      AGENTCORE_MAX_CONCURRENT_INVOCATIONS: ${{ vars.AGENTCORE_MAX_CONCURRENT_INVOCATIONS || '16' }}
      REDIS_REPLICATION_GROUP_ID: ${{ vars.REDIS_REPLICATION_GROUP_ID }}
      LEGAL_RELEASE_EVIDENCE_SHA256: ${{ vars.LEGAL_RELEASE_EVIDENCE_SHA256 }}
      LEGAL_RELEASE_EVIDENCE_BUNDLE_S3_URI: ${{ vars.LEGAL_RELEASE_EVIDENCE_BUNDLE_S3_URI }}
      LEGAL_RELEASE_EVIDENCE_BUNDLE_S3_VERSION_ID: ${{ vars.LEGAL_RELEASE_EVIDENCE_BUNDLE_S3_VERSION_ID }}
      LEGAL_RELEASE_EVIDENCE_BUNDLE_SHA256: ${{ vars.LEGAL_RELEASE_EVIDENCE_BUNDLE_SHA256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Bind the protected controller and verify signed Passport/READY artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_POLICY_READ_TOKEN: ${{ secrets.PRODUCTION_POLICY_READ_TOKEN }}
          INPUT_UAT_RUN_ID: ${{ inputs.uat_run_id }}
          INPUT_READY_RUN_ID: ${{ inputs.readiness_run_id || github.run_id }}
          READY_SOURCE: ${{ inputs.readiness_run_id && 'standalone' || 'inline' }}
          INPUT_MODE: ${{ inputs.requested_serving_mode }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          git fetch --no-tags origin main --force
          test "$GITHUB_WORKFLOW_SHA" = "$(git rev-parse origin/main)"
          [[ "$INPUT_UAT_RUN_ID" =~ ^[1-9][0-9]*$ && "$INPUT_READY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          case "$INPUT_MODE" in maintenance_closed|live) ;; *) exit 2 ;; esac
          root="$RUNNER_TEMP/production-promotion-v2"
          evidence="$root/deployment-evidence"
          mkdir -m 700 -p "$root" "$evidence"

          test -n "$GH_POLICY_READ_TOKEN"
          echo 'PRODUCTION_POLICY_READ_TOKEN_CONFIGURED=true' >> "$GITHUB_ENV"
          curl_retry=(--retry 2 --retry-delay 2 --retry-max-time 70 --retry-all-errors)
          status="$(curl --silent --show-error --location "${curl_retry[@]}" \
            --output "$root/main-protection.json" \
            --write-out '%{http_code}' --header "Authorization: Bearer $GH_POLICY_READ_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/branches/main/protection")"
          test "$status" = 200
          jq -e '.required_status_checks.strict==true
            and .required_pull_request_reviews.required_approving_review_count>=1
            and .allow_force_pushes.enabled==false and .allow_deletions.enabled==false' \
            "$root/main-protection.json" >/dev/null

          # Inline READY is this very run, so it is necessarily still executing: assert the run is
          # unfinished instead of successful. Anything but the exact literal 'inline' takes the
          # unchanged standalone branch, so an unexpected value fails closed.
          ready_run="$root/readiness-run.json"
          ready_path=.github/workflows/production-readiness.yml
          inline=false
          if [ "$READY_SOURCE" = inline ]; then
            test "$INPUT_READY_RUN_ID" = "$GITHUB_RUN_ID"
            ready_path=.github/workflows/deploy-production-v2.yml
            inline=true
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_READY_RUN_ID" > "$ready_run"
          jq -e --arg id "$INPUT_READY_RUN_ID" --arg repository "$GITHUB_REPOSITORY" \
            --arg path "$ready_path" --argjson inline "$inline" '
            (.id|tostring)==$id and .path==$path and .head_branch=="main"
            and (.event=="workflow_run" or .event=="workflow_dispatch")
            and .repository.full_name==$repository
            and (if $inline then .conclusion==null
              else .status=="completed" and .conclusion=="success" end)
          ' "$ready_run" >/dev/null
          ready_attempt="$(jq -er '.run_attempt|select(type=="number" and floor==. and .>=1)' "$ready_run")"
          ready_controller="$(jq -er '.head_sha|select(test("^[0-9a-f]{40}$"))' "$ready_run")"
          ready_event="$(jq -er '.event' "$ready_run")"
          test "$ready_controller" = "$GITHUB_WORKFLOW_SHA" || {
            echo 'ERROR: Production controller changed after READY; rerun read-only readiness without repeating UAT' >&2
            exit 1
          }
          ready_metadata="$root/readiness-artifact.json"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_READY_RUN_ID/artifacts" \
            -f per_page=100 > "$ready_metadata"
          ready_name="$(jq -er --arg run "$INPUT_READY_RUN_ID" --argjson attempt "$ready_attempt" '
            [.artifacts[]|select(.expired==false)|.name
              |select(test("^production-release-ready-v2-[0-9a-f]{40}-run-"+$run+"-attempt-"+($attempt|tostring)+"$"))]
            |select(length==1)|.[0]' "$ready_metadata")"
          ready_archive="$root/readiness.zip"
          ready_id="$(jq -er --arg name "$ready_name" '
            [.artifacts[]|select(.name==$name and .expired==false)]|select(length==1)|.[0].id' "$ready_metadata")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ready_id/zip" > "$ready_archive"
          jq -cS --arg name "$ready_name" '.artifacts=[.artifacts[]|select(.name==$name)]|.total_count=1' \
            "$ready_metadata" > "$root/readiness-artifact-exact.json"
          source infra/security/validate-production-security-preflight.sh
          security_preflight_validate_artifact_metadata "$root/readiness-artifact-exact.json" \
            "$ready_archive" "$ready_name" "$INPUT_READY_RUN_ID" "$ready_controller" >/dev/null
          ready_profile=ready-v2-quick
          zipinfo -1 "$ready_archive" | grep -Fxq clone-result.json && ready_profile=ready-v2-migration
          ready_root="$(security_preflight_extract_artifact "$ready_profile" "$ready_archive")"
          source_sha="$(jq -er '.sourceCommit|select(test("^[0-9a-f]{40}$"))' "$ready_root/ready.json")"
          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor "$source_sha" origin/main
          ready_uat="$(jq -er '.passportRef.runId' "$ready_root/ready.json")"
          ready_uat_attempt="$(jq -er '.passportRef.runAttempt' "$ready_root/ready.json")"
          test "$ready_uat" = "$INPUT_UAT_RUN_ID"
          test "$(jq -er '.serving.requestedMode' "$ready_root/ready.json")" = "$INPUT_MODE"
          cosign verify-blob --bundle "$ready_root/ready.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/production-readiness.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$ready_controller" \
            --certificate-github-workflow-trigger "$ready_event" "$ready_root/ready.json"
          bash infra/security/validate-production-release-ready-v2.sh "$ready_root/ready.json" \
            "$ready_root" "$ready_root/passport.json" "$source_sha" "$ready_uat" \
            "$ready_uat_attempt" "$INPUT_READY_RUN_ID" "$ready_attempt" "$ready_controller" \
            "$GITHUB_REPOSITORY" "$(date -u +%s)" >/dev/null

          uat_run="$root/uat-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_UAT_RUN_ID" > "$uat_run"
          jq -e --arg id "$INPUT_UAT_RUN_ID" --arg repository "$GITHUB_REPOSITORY" '
            (.id|tostring)==$id and .status=="completed" and .conclusion=="success"
            and .event=="workflow_dispatch" and .path==".github/workflows/deploy-uat.yml"
            and .head_branch=="main" and (.head_sha|test("^[0-9a-f]{40}$"))
            and .repository.full_name==$repository
          ' "$uat_run" >/dev/null
          test "$(jq -er '.run_attempt' "$uat_run")" = "$ready_uat_attempt"
          uat_controller="$(jq -er '.head_sha' "$uat_run")"
          uat_metadata="$root/uat-artifacts.json"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_UAT_RUN_ID/artifacts" \
            -f per_page=100 > "$uat_metadata"
          passport_name="uat-release-passport-v2-${source_sha}-attempt-${ready_uat_attempt}"
          passport_id="$(jq -er --arg name "$passport_name" '
            [.artifacts[]|select(.name==$name and .expired==false)]|select(length==1)|.[0].id' "$uat_metadata")"
          passport_archive="$root/passport.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$passport_id/zip" > "$passport_archive"
          jq -cS --arg name "$passport_name" '.artifacts=[.artifacts[]|select(.name==$name)]|.total_count=1' \
            "$uat_metadata" > "$root/uat-artifact-exact.json"
          security_preflight_validate_artifact_metadata "$root/uat-artifact-exact.json" \
            "$passport_archive" "$passport_name" "$INPUT_UAT_RUN_ID" "$uat_controller" >/dev/null
          passport_root="$(security_preflight_extract_artifact passport-v2 "$passport_archive")"
          cmp -s "$passport_root/passport.json" "$ready_root/passport.json"
          cosign verify-blob --bundle "$passport_root/passport.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-uat.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$uat_controller" \
            --certificate-github-workflow-trigger workflow_dispatch "$passport_root/passport.json"
          bash infra/security/validate-uat-release-passport-v2.sh "$passport_root/passport.json" \
            "$passport_root" "$source_sha" "$INPUT_UAT_RUN_ID" "$ready_uat_attempt" \
            "$uat_controller" "$GITHUB_REPOSITORY" "$AWS_ACCOUNT_ID" "$AWS_REGION" \
            "$(date -u +%s)" >/dev/null
          mkdir -p release
          cp "$passport_root/release/production-image-manifest.json" release/production-image-manifest.json
          cmp -s "$passport_root/release/line-ai-release-manifest.json" \
            "$ready_root/line-ai-release-manifest.json"
          test "$(bash infra/ai-gateway/validate-line-ai-release-manifest.sh \
            "$ready_root/line-ai-release-manifest.json" \
            "$passport_root/release/production-image-manifest.json" \
            "$passport_root/release/agentcore" "$passport_root/release/line-ai-contract.ts" \
            "$source_sha")" = "$source_sha"
          qualifier="$(bash infra/ai-gateway/validate-agentcore-candidate-binding.sh \
            "$ready_root/agentcore-production-binding.json" \
            "$ready_root/line-ai-release-manifest.json" production)"
          runtime_arn="$(jq -er '.runtime.arn' "$ready_root/agentcore-production-binding.json")"
          artifact_sha="$(jq -er '.artifact.sha256' "$ready_root/agentcore-production-binding.json")"
          contract_version="$(jq -er '.contractVersion' "$ready_root/agentcore-production-binding.json")"
          cp "$ready_root/line-ai-release-manifest.json" release/line-ai-release-manifest.json
          cp "$ready_root/agentcore-production-binding.json" release/agentcore-production-binding.json
          test "$(bash infra/docker/validate-production-manifest.sh release/production-image-manifest.json \
            "$AWS_ACCOUNT_ID" "$AWS_REGION")" = "$source_sha"
          release_image="$(jq -er '.tools[]|select(.purpose=="release-task")|.image' "$passport_root/passport.json")"
          migration_image="$(jq -er '.tools[]|select(.purpose=="migration-tool")|.image' "$passport_root/passport.json")"
          ready_hash="$(sha256sum "$ready_root/ready.json"|awk '{print $1}')"
          migration_status="$(jq -er '.migration.status' "$ready_root/ready.json")"
          pending="$(jq -er '.migration.pendingMigrationCount' "$ready_root/ready.json")"
          effective_target="$(jq -er '.serving.effectiveTarget' "$ready_root/ready.json")"
          legal_mode="$(jq -er '.legal.mode' "$ready_root/ready.json")"
          owner_override_ref="$(jq -r '.legal.ownerApprovalRef // ""' "$ready_root/ready.json")"
          owner_override_actor="$(jq -r '.legal.approvedBy // ""' "$ready_root/ready.json")"
          case "$effective_target" in all|api-web|ai-gateway|workers) ;; *) exit 2 ;; esac
          case "$legal_mode" in NOT_APPLICABLE|VERIFIED_BUNDLE|OWNER_OVERRIDE) ;; *) exit 2 ;; esac
          baseline_closed="$(jq -r '[.productionBaseline.services[].servingMode=="maintenance_only"]|all' "$ready_root/ready.json")"
          already_candidate_closed="$(jq -n --slurpfile ready "$ready_root/ready.json" \
            --slurpfile manifest release/production-image-manifest.json '
            ($ready[0].productionBaseline.services|sort_by(.service)) as $services
            | ($manifest[0].images|sort_by(.service)) as $images
            | ([$services[].servingMode=="maintenance_only"]|all)
              and ([range(0;3)|$services[.].image==$images[.].image]|all)')"
          final_mode=maintenance_only
          [ "$INPUT_MODE" = live ] && final_mode=live
          requires_closed_stage=false
          if [ "$INPUT_MODE" = maintenance_closed ] || [ "$pending" -gt 0 ]; then
            requires_closed_stage=true
          fi
          printf '%s\n' \
            "PROMOTION_ROOT=$root" "DEPLOYMENT_EVIDENCE_DIR=$evidence" \
            "READY_ROOT=$ready_root" "PASSPORT_ROOT=$passport_root" \
            "LINE_AI_RELEASE_MANIFEST=$ready_root/line-ai-release-manifest.json" \
            "AGENTCORE_CANDIDATE_BINDING=$ready_root/agentcore-production-binding.json" \
            "AGENTCORE_RUNTIME_ARN=$runtime_arn" "AGENTCORE_RUNTIME_QUALIFIER=$qualifier" \
            "AGENTCORE_EXPECTED_SOURCE_COMMIT=$source_sha" \
            "AGENTCORE_EXPECTED_ARTIFACT_SHA256=$artifact_sha" \
            "AGENTCORE_EXPECTED_CONTRACT_VERSION=$contract_version" \
            "SOURCE_SHA=$source_sha" "READY_SHA256=$ready_hash" \
            "READY_RUN_ID=$INPUT_READY_RUN_ID" \
            "READY_RUN_ATTEMPT=$ready_attempt" "READY_CONTROLLER=$ready_controller" \
            "RELEASE_TASK_IMAGE=$release_image" "MIGRATION_IMAGE=$migration_image" \
            "MIGRATION_STATUS=$migration_status" "PENDING_MIGRATION_COUNT=$pending" \
            "EFFECTIVE_TARGET=$effective_target" "REQUIRES_CLOSED_STAGE=$requires_closed_stage" \
            "LEGAL_MODE=$legal_mode" "OWNER_OVERRIDE_REF=$owner_override_ref" \
            "OWNER_OVERRIDE_ACTOR=$owner_override_actor" \
            "BASELINE_CLOSED=$baseline_closed" "ALREADY_CANDIDATE_CLOSED=$already_candidate_closed" \
            "FINAL_SERVING_MODE=$final_mode" >> "$GITHUB_ENV"

          jq -cnS --arg source "$source_sha" --arg ready "$INPUT_READY_RUN_ID" \
            --arg readySha "$ready_hash" --arg uat "$INPUT_UAT_RUN_ID" --arg mode "$INPUT_MODE" \
            --arg controller "$GITHUB_WORKFLOW_SHA" --arg run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" '
            {schemaVersion:2,state:"PRE_MUTATION",sourceCommit:$source,uatRunId:$uat,
             readinessRunId:$ready,readySha256:$readySha,requestedServingMode:$mode,
             controllerCommit:$controller,promotionRunId:$run,promotionRunAttempt:$attempt}
          ' > "$evidence/controller.json"

      - name: Revalidate current legal evidence for a live opening
        if: inputs.requested_serving_mode == 'live' && env.LEGAL_MODE == 'VERIFIED_BUNDLE'
        run: bash infra/security/provision-legal-release-evidence.sh preflight
      - name: Configure narrow legal reader for a live opening
        if: inputs.requested_serving_mode == 'live' && env.LEGAL_MODE == 'VERIFIED_BUNDLE'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.LEGAL_RELEASE_EVIDENCE_READER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: production-v2-legal-${{ github.run_id }}
          unset-current-credentials: true
      - name: Revalidate the independently reviewed live legal bundle
        if: inputs.requested_serving_mode == 'live' && env.LEGAL_MODE == 'VERIFIED_BUNDLE'
        run: |
          set -euo pipefail
          legal="$(bash infra/security/provision-legal-release-evidence.sh provision)"
          LEGAL_RELEASE_EVIDENCE_DIR="$legal" bash infra/security/validate-legal-release-readiness.sh
          echo "LEGAL_EVIDENCE_DIR=$legal" >> "$GITHUB_ENV"

      - name: Honor the signed owner legal override for a live opening
        if: inputs.requested_serving_mode == 'live' && env.LEGAL_MODE == 'OWNER_OVERRIDE'
        run: |
          set -euo pipefail
          test "$OWNER_OVERRIDE_ACTOR" = MangmeeDev
          [[ "$OWNER_OVERRIDE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:/@+=,-]{7,159}$ ]]

      - name: Configure read-only Production security credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::311414082667:role/watchdog-bms-production-security-readonly
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: production-v2-security-${{ github.run_id }}
          unset-current-credentials: true
      # Duplicate of READY. Inline READY read exactly this ground minutes ago in this same run, so
      # these three read-only rechecks only run when READY came from a separate, older run.
      - name: Recheck exact image availability and hard runtime baseline
        if: inputs.readiness_run_id != ''
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r repository digest; do
            aws ecr describe-images --region "$AWS_REGION" --repository-name "$repository" \
              --image-ids "imageDigest=$digest" --output json \
              | jq -e --arg repository "$repository" --arg digest "$digest" '
                (.imageDetails|length)==1 and .imageDetails[0].repositoryName==$repository
                and .imageDetails[0].imageDigest==$digest' >/dev/null
          done < <(jq -r '(.release.images[]|[.repository,.digest]|@tsv),
            (.tools[]|[.repository,.digest]|@tsv)' "$PASSPORT_ROOT/passport.json")
          bash infra/security/collect-production-runtime-readiness-v2.sh \
            "$REDIS_REPLICATION_GROUP_ID" "$PROMOTION_ROOT/current-runtime.json"

      - name: Configure clone-policy reader for a pending migration
        if: env.MIGRATION_STATUS == 'APPEND_ONLY_PENDING'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::311414082667:role/watchdog-bms-production-a5-clone
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: production-v2-clone-policy-${{ github.run_id }}
          unset-current-credentials: true
      - name: Recheck exact clone policy for a pending migration
        if: inputs.readiness_run_id != '' && env.MIGRATION_STATUS == 'APPEND_ONLY_PENDING'
        run: |
          set -euo pipefail
          role=watchdog-bms-production-a5-clone
          role_json="$PROMOTION_ROOT/clone-role.json"; policy_json="$PROMOTION_ROOT/clone-policy.json"
          aws iam get-role --role-name "$role" --output json | jq -cS . > "$role_json"
          aws iam get-role-policy --role-name "$role" --policy-name "$role" --output json | jq -cS . > "$policy_json"
          jq -e --slurpfile expected infra/security/production-a5-clone-trust.template.json \
            '.Role.AssumeRolePolicyDocument==$expected[0]' "$role_json" >/dev/null
          jq -e --arg role "$role" --slurpfile expected infra/security/production-a5-clone-policy.template.json \
            '.PolicyName==$role and .PolicyDocument==$expected[0]' "$policy_json" >/dev/null
          test "$(aws iam list-role-policies --role-name "$role" --output json|jq -cS '.PolicyNames|sort')" \
            = "$(jq -cnS --arg role "$role" '[$role]')"
          test "$(aws iam list-attached-role-policies --role-name "$role" --output json|jq -cS '.AttachedPolicies')" = '[]'
          hash="$(jq -cnS --slurpfile role "$role_json" --slurpfile policy "$policy_json" \
            '{trust:$role[0].Role.AssumeRolePolicyDocument,policy:$policy[0].PolicyDocument}' \
            | sha256sum | awk '{print $1}')"
          jq -cS --arg hash "$hash" '.clonePolicySha256=$hash' \
            "$PROMOTION_ROOT/current-runtime.json" > "$PROMOTION_ROOT/runtime.tmp"
          mv "$PROMOTION_ROOT/runtime.tmp" "$PROMOTION_ROOT/current-runtime.json"

      - name: Configure the dedicated A5 read-only controller
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::311414082667:role/watchdog-bms-production-a5-readonly
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: production-v2-reader-${{ github.run_id }}
          unset-current-credentials: true
      - name: Recheck service, IAM and migration baselines before deploy authority
        if: inputs.readiness_run_id != ''
        run: |
          set -euo pipefail
          role=watchdog-bms-production-a5-readonly
          role_json="$PROMOTION_ROOT/a5-role.json"; policy_json="$PROMOTION_ROOT/a5-policy.json"
          aws iam get-role --role-name "$role" --output json | jq -cS . > "$role_json"
          aws iam get-role-policy --role-name "$role" --policy-name "$role" --output json | jq -cS . > "$policy_json"
          jq -e --slurpfile expected infra/security/production-a5-readonly-trust.template.json \
            '.Role.AssumeRolePolicyDocument==$expected[0]' "$role_json" >/dev/null
          jq -e --arg role "$role" --slurpfile expected infra/security/production-a5-readonly-policy.template.json \
            '.PolicyName==$role and .PolicyDocument==$expected[0]' "$policy_json" >/dev/null
          test "$(aws iam list-role-policies --role-name "$role" --output json|jq -cS '.PolicyNames|sort')" \
            = "$(jq -cnS --arg role "$role" '[$role]')"
          test "$(aws iam list-attached-role-policies --role-name "$role" --output json|jq -cS '.AttachedPolicies')" = '[]'
          hash="$(jq -cnS --slurpfile role "$role_json" --slurpfile policy "$policy_json" \
            '{trust:$role[0].Role.AssumeRolePolicyDocument,policy:$policy[0].PolicyDocument}' \
            | sha256sum | awk '{print $1}')"
          jq -cS --arg hash "$hash" '.a5PolicySha256=$hash' \
            "$PROMOTION_ROOT/current-runtime.json" > "$PROMOTION_ROOT/runtime.tmp"
          mv "$PROMOTION_ROOT/runtime.tmp" "$PROMOTION_ROOT/current-runtime.json"
          health="$PROMOTION_ROOT/current-health"; mkdir "$health"
          A5_HEALTH_STABILITY_SECONDS=2 bash infra/security/collect-production-a5-current-health.sh "$health" >/dev/null
          catalog="$PROMOTION_ROOT/current-catalog"; mkdir "$catalog"
          AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" AWS_REGION="$AWS_REGION" SOURCE_SHA="$SOURCE_SHA" \
            READINESS_RUN_ID="$GITHUB_RUN_ID" READINESS_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            MIGRATION_IMAGE="$MIGRATION_IMAGE" PASSPORT_MIGRATION_CATALOG="$PASSPORT_ROOT/migration-catalog.json" \
            OUTPUT_DIR="$catalog" bash infra/security/run-production-migration-catalog-readiness.sh >/dev/null
          bash infra/security/compare-production-ready-baseline-v2.sh "$READY_ROOT/ready.json" \
            "$READY_ROOT/production-runtime.json" "$READY_ROOT/catalog-result.json" \
            "$health/current-health.json" "$PROMOTION_ROOT/current-runtime.json" \
            "$catalog/catalog-result.json" >/dev/null

      - name: Configure mutation-capable Production deploy credentials only after READY recheck
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
          role-session-name: production-v2-deploy-${{ github.run_id }}
          unset-current-credentials: true
      - name: Recheck stable service identity at the mutation boundary
        run: |
          set -euo pipefail
          health="$PROMOTION_ROOT/mutation-boundary-health"; mkdir "$health"
          A5_HEALTH_STABILITY_SECONDS=2 bash infra/security/collect-production-a5-current-health.sh "$health" >/dev/null
          jq -e --slurpfile ready "$READY_ROOT/ready.json" '
            [.services[] | . as $s
              | .rawEvidence.describeExpressGatewayService.raw.second.service.activeConfigurations[0] as $a
              | {service:$s.service,image:$a.primaryContainer.image,
                 sourceCommit:([$a.primaryContainer.environment[]?|select(.name=="GIT_SHA")|.value][0]),
                 servingMode:$s.servingMode,
                 serviceRevisionArn:$s.serviceRevisionArn,taskDefinitionArn:$s.taskDefinition.arn,
                 lineAiBinding:(if $s.service=="ai-gateway" then
                   {runtime:([$a.primaryContainer.environment[]?|select(.name=="LINE_AI_AGENT_RUNTIME")|.value][0]),
                    runtimeArn:([$a.primaryContainer.environment[]?|select(.name=="AGENTCORE_RUNTIME_ARN")|.value][0]),
                    qualifier:([$a.primaryContainer.environment[]?|select(.name=="AGENTCORE_RUNTIME_QUALIFIER")|.value][0]),
                    expectedSourceCommit:([$a.primaryContainer.environment[]?|select(.name=="AGENTCORE_EXPECTED_SOURCE_COMMIT")|.value][0]),
                    expectedArtifactSha256:([$a.primaryContainer.environment[]?|select(.name=="AGENTCORE_EXPECTED_ARTIFACT_SHA256")|.value][0]),
                    expectedContractVersion:([$a.primaryContainer.environment[]?|select(.name=="AGENTCORE_EXPECTED_CONTRACT_VERSION")|.value][0])}
                   else null end)}]
              |sort_by(.service)==($ready[0].productionBaseline.services|sort_by(.service))
          ' "$health/current-health.json" >/dev/null

      - name: Prove maintenance bootstrap compatibility before closing Production
        if: env.REQUIRES_CLOSED_STAGE == 'true' && env.ALREADY_CANDIDATE_CLOSED != 'true'
        env:
          PRODUCTION_SERVING_MODE: maintenance_only
          RELEASE_MODE: maintenance-bootstrap
          RELEASE_DEPLOY_TARGET: all
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
          MAINTENANCE_BOOTSTRAP_READONLY: 'true'
          REIMBURSEMENT_WRITE_QUIESCE: 'true'
        run: bash infra/prod-ecs-express/run-release-task.sh "$RELEASE_TASK_IMAGE" "$SOURCE_SHA" maintenance-preflight

      - name: Close the exact candidate before any Production database mutation
        id: bootstrap-close
        if: env.REQUIRES_CLOSED_STAGE == 'true' && env.ALREADY_CANDIDATE_CLOSED != 'true'
        env:
          PRODUCTION_SERVING_MODE: maintenance_only
          RELEASE_MODE: maintenance-bootstrap
          RELEASE_DEPLOY_TARGET: all
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
          MAINTENANCE_BOOTSTRAP_READONLY: 'true'
          REIMBURSEMENT_WRITE_QUIESCE: 'true'
        run: |
          set -euo pipefail
          closed="$DEPLOYMENT_EVIDENCE_DIR/bootstrap-closed"; mkdir -m 700 "$closed"
          DEPLOYMENT_EVIDENCE_DIR="$closed" RELEASE_TASKS_APPLIED_SHA="${SOURCE_SHA:0:12}" \
            bash infra/prod-ecs-express/deploy.sh all
          export WORKER_INTERNAL_TOKEN
          WORKER_INTERNAL_TOKEN="$(aws secretsmanager get-secret-value --region "$AWS_REGION" \
            --secret-id watchdog-bms/production/worker-internal-token --query SecretString --output text)"
          bash infra/prod-ecs-express/verify-deployment.sh "$PRODUCTION_IMAGE_MANIFEST" all
          DEPLOYMENT_EVIDENCE_DIR="$closed" \
            bash infra/prod-ecs-express/verify-production-maintenance.sh all
          cp "$closed/maintenance-proof.json" "$DEPLOYMENT_EVIDENCE_DIR/bootstrap-maintenance-proof.json"

      - name: Prove an already-deployed exact candidate remains closed
        if: env.REQUIRES_CLOSED_STAGE == 'true' && env.ALREADY_CANDIDATE_CLOSED == 'true'
        env:
          PRODUCTION_SERVING_MODE: maintenance_only
          RELEASE_MODE: passport-promotion
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
          REIMBURSEMENT_WRITE_QUIESCE: 'true'
        run: |
          set -euo pipefail
          export WORKER_INTERNAL_TOKEN
          WORKER_INTERNAL_TOKEN="$(aws secretsmanager get-secret-value --region "$AWS_REGION" \
            --secret-id watchdog-bms/production/worker-internal-token --query SecretString --output text)"
          bash infra/prod-ecs-express/verify-deployment.sh "$PRODUCTION_IMAGE_MANIFEST" all
          closed="$DEPLOYMENT_EVIDENCE_DIR/continuous-closed"; mkdir -m 700 "$closed"
          DEPLOYMENT_EVIDENCE_DIR="$closed" \
            bash infra/prod-ecs-express/verify-production-maintenance.sh all
          cp "$closed/maintenance-proof.json" "$DEPLOYMENT_EVIDENCE_DIR/bootstrap-maintenance-proof.json"

      - name: Expire direct-storage URLs only on an OPEN to CLOSED transition
        if: env.REQUIRES_CLOSED_STAGE == 'true' && env.BASELINE_CLOSED != 'true'
        env:
          PRODUCTION_SERVING_MODE: maintenance_only
          RELEASE_DEPLOY_TARGET: all
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
        run: |
          set -euo pipefail
          export MAINTENANCE_CLOSED_AT_EPOCH="$(date -u +%s)"
          bash infra/prod-ecs-express/wait-production-maintenance-ingress-drain.sh \
            "$DEPLOYMENT_EVIDENCE_DIR/maintenance-ingress-drain.json"

      - name: Refresh Production deploy credentials for the durable release envelope
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
          role-session-name: production-v2-release-${{ github.run_id }}
          unset-current-credentials: true
      - name: Persist the durable release operation identity before database preparation
        run: |
          set -euo pipefail
          operation_id="$(tr '[:upper:]' '[:lower:]' < /proc/sys/kernel/random/uuid)"
          [[ "$operation_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          printf '%s\n' "RELEASE_OPERATION_ID=$operation_id" >> "$GITHUB_ENV"
          jq -cnS --arg operation "$operation_id" \
            '{operationId:$operation,state:"ALLOCATED_BEFORE_RELEASE_PREPARE"}' \
            > "$DEPLOYMENT_EVIDENCE_DIR/release-operation.json"

      - name: Recheck signed READY migration authority inside the durable database fence
        id: release-prepare
        env:
          RELEASE_MODE: passport-promotion
          RELEASE_DEPLOY_TARGET: ${{ env.EFFECTIVE_TARGET }}
          RELEASE_DATABASE_AUTHORITY: PRODUCTION_READY_V2
          PRODUCTION_READY_V2_SHA256: ${{ env.READY_SHA256 }}
        run: |
          set -euo pipefail
          bash infra/security/validate-production-release-ready-v2.sh "$READY_ROOT/ready.json" \
            "$READY_ROOT" "$PASSPORT_ROOT/passport.json" "$SOURCE_SHA" \
            "${{ inputs.uat_run_id }}" "$(jq -er '.passportRef.runAttempt' "$READY_ROOT/ready.json")" \
            "$READY_RUN_ID" "$READY_RUN_ATTEMPT" "$READY_CONTROLLER" \
            "$GITHUB_REPOSITORY" "$(date -u +%s)" >/dev/null
          if [ "${{ inputs.requested_serving_mode }}" = live ] \
              && [ "$LEGAL_MODE" = VERIFIED_BUNDLE ]; then
            LEGAL_RELEASE_EVIDENCE_DIR="$LEGAL_EVIDENCE_DIR" \
              bash infra/security/validate-legal-release-readiness.sh
          elif [ "${{ inputs.requested_serving_mode }}" = live ]; then
            test "$LEGAL_MODE" = OWNER_OVERRIDE
            test "$OWNER_OVERRIDE_ACTOR" = MangmeeDev
            [[ "$OWNER_OVERRIDE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:/@+=,-]{7,159}$ ]]
          fi
          export PRODUCTION_READY_REPOSITORY_CATALOG_HASH PRODUCTION_READY_APPLIED_CATALOG_HASH
          export PRODUCTION_READY_PENDING_CATALOG_HASH PRODUCTION_READY_PENDING_COUNT
          PRODUCTION_READY_REPOSITORY_CATALOG_HASH="$(jq -er '.repositoryCatalogHash' "$READY_ROOT/catalog-result.json")"
          PRODUCTION_READY_APPLIED_CATALOG_HASH="$(jq -er '.appliedCatalogHash' "$READY_ROOT/catalog-result.json")"
          PRODUCTION_READY_PENDING_CATALOG_HASH="$(jq -er '.pendingCatalogHash' "$READY_ROOT/catalog-result.json")"
          PRODUCTION_READY_PENDING_COUNT="$(jq -er '.pendingMigrationCount' "$READY_ROOT/catalog-result.json")"
          log="$DEPLOYMENT_EVIDENCE_DIR/release-prepare.log"
          set +e
          bash infra/security/run-production-release-prepare.sh \
            "$RELEASE_TASK_IMAGE" "$SOURCE_SHA" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          task_arn="$(sed -n 's/^\[release-task\] task=\([^ ]*\) .*/\1/p' "$log" | tail -n 1)"
          jq -cS --arg task "$task_arn" --argjson status "$status" \
            '.+{taskArn:(if $task=="" then null else $task end),releasePrepareExitCode:$status,
              state:(if $status==0 then "HELD_FOR_ROLLOUT" else "RECONCILIATION_MAY_BE_REQUIRED" end)}' \
            "$DEPLOYMENT_EVIDENCE_DIR/release-operation.json" \
            > "$DEPLOYMENT_EVIDENCE_DIR/release-operation.tmp"
          mv "$DEPLOYMENT_EVIDENCE_DIR/release-operation.tmp" \
            "$DEPLOYMENT_EVIDENCE_DIR/release-operation.json"
          exit "$status"

      - name: Roll out the exact UAT image digests without rebuilding
        id: rollout
        env:
          PRODUCTION_SERVING_MODE: ${{ env.FINAL_SERVING_MODE }}
          RELEASE_MODE: passport-promotion
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
        run: |
          set -euo pipefail
          quiesce=false
          [ "$PRODUCTION_SERVING_MODE" != maintenance_only ] || quiesce=true
          REIMBURSEMENT_WRITE_QUIESCE="$quiesce" \
            RELEASE_TASKS_APPLIED_SHA="${SOURCE_SHA:0:12}" \
            bash infra/prod-ecs-express/deploy.sh "$EFFECTIVE_TARGET"

      - name: Verify exact digest, source, serving mode, health and deep DB readiness
        id: verify-health
        env:
          PRODUCTION_SERVING_MODE: ${{ env.FINAL_SERVING_MODE }}
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
        run: |
          set -euo pipefail
          export WORKER_INTERNAL_TOKEN
          WORKER_INTERNAL_TOKEN="$(aws secretsmanager get-secret-value --region "$AWS_REGION" \
            --secret-id watchdog-bms/production/worker-internal-token --query SecretString --output text)"
          bash infra/prod-ecs-express/verify-deployment.sh "$PRODUCTION_IMAGE_MANIFEST" "$EFFECTIVE_TARGET"

      - name: Prove the final release remains globally closed
        if: inputs.requested_serving_mode == 'maintenance_closed'
        id: verify-maintenance
        env:
          PRODUCTION_SERVING_MODE: maintenance_only
          RELEASE_MODE: passport-promotion
          RELEASE_DEPLOY_TARGET: all
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
          REIMBURSEMENT_WRITE_QUIESCE: 'true'
        run: bash infra/prod-ecs-express/verify-production-maintenance.sh all

      - name: Refresh Production deploy credentials for bounded closed-stage recovery
        id: refresh-recovery
        if: >-
          always() && env.REQUIRES_CLOSED_STAGE == 'true' &&
          (steps.bootstrap-close.outcome == 'failure' || steps.rollout.outcome == 'failure' ||
          steps.verify-health.outcome == 'failure' ||
          (inputs.requested_serving_mode == 'maintenance_closed' &&
          steps.verify-maintenance.outcome == 'failure'))
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
          role-session-name: production-v2-recovery-${{ github.run_id }}
          unset-current-credentials: true
      - name: Recover an unsuccessful closed-stage promotion to the exact closed candidate
        id: recover-closed
        if: >-
          always() && env.REQUIRES_CLOSED_STAGE == 'true' &&
          steps.refresh-recovery.outcome == 'success' &&
          (steps.bootstrap-close.outcome == 'failure' || steps.rollout.outcome == 'failure' ||
          steps.verify-health.outcome == 'failure' ||
          (inputs.requested_serving_mode == 'maintenance_closed' &&
          steps.verify-maintenance.outcome == 'failure'))
        env:
          PRODUCTION_SERVING_MODE: maintenance_only
          RELEASE_DEPLOY_TARGET: all
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
          REIMBURSEMENT_WRITE_QUIESCE: 'true'
        run: |
          set -euo pipefail
          echo '::warning::Final promotion proof failed; restoring the exact UAT candidate in global maintenance mode'
          if [[ "${RELEASE_PARENT_OPERATION_ID:-}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            export RELEASE_MODE=passport-promotion
          else
            export RELEASE_MODE=maintenance-bootstrap MAINTENANCE_BOOTSTRAP_READONLY=true
            recovery="$DEPLOYMENT_EVIDENCE_DIR/bootstrap-recovery"; mkdir -m 700 "$recovery"
            export DEPLOYMENT_EVIDENCE_DIR="$recovery"
          fi
          RELEASE_TASKS_APPLIED_SHA="${SOURCE_SHA:0:12}" \
            bash infra/prod-ecs-express/deploy.sh all
          export WORKER_INTERNAL_TOKEN
          WORKER_INTERNAL_TOKEN="$(aws secretsmanager get-secret-value --region "$AWS_REGION" \
            --secret-id watchdog-bms/production/worker-internal-token --query SecretString --output text)"
          bash infra/prod-ecs-express/verify-deployment.sh "$PRODUCTION_IMAGE_MANIFEST" all
          if [ ! -f "$DEPLOYMENT_EVIDENCE_DIR/maintenance-ingress-drain.json" ]; then
            export MAINTENANCE_CLOSED_AT_EPOCH="$(date -u +%s)"
            bash infra/prod-ecs-express/wait-production-maintenance-ingress-drain.sh \
              "$DEPLOYMENT_EVIDENCE_DIR/maintenance-ingress-drain.json"
          fi
          bash infra/prod-ecs-express/verify-production-maintenance.sh all
          echo 'PROMOTION_SAFE_RECOVERY=true' >> "$GITHUB_ENV"

      - name: Refresh Production deploy credentials for durable release finalization
        id: refresh-finalize
        if: >-
          always() && steps.release-prepare.outcome == 'success' &&
          env.RELEASE_PARENT_OPERATION_ID != '' &&
          (env.EFFECTIVE_TARGET == 'all' || env.EFFECTIVE_TARGET == 'api-web' ||
          ((env.EFFECTIVE_TARGET == 'ai-gateway' || env.EFFECTIVE_TARGET == 'workers') &&
          steps.verify-health.outcome == 'success'))
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
          role-session-name: production-v2-finalize-${{ github.run_id }}
          unset-current-credentials: true
      - name: Retire or reconcile launch-build authority and finalize the durable release
        if: always() && steps.refresh-finalize.outcome == 'success' && steps.release-prepare.outcome == 'success' && env.RELEASE_PARENT_OPERATION_ID != '' && (env.EFFECTIVE_TARGET == 'all' || env.EFFECTIVE_TARGET == 'api-web')
        env:
          PRODUCTION_SERVING_MODE: ${{ env.FINAL_SERVING_MODE }}
          RELEASE_MODE: passport-promotion
          PRODUCTION_IMAGE_MANIFEST: ${{ github.workspace }}/release/production-image-manifest.json
          HEALTH_VERIFIED: ${{ env.PROMOTION_SAFE_RECOVERY == 'true' || (steps.verify-health.outcome == 'success' && (inputs.requested_serving_mode == 'live' || steps.verify-maintenance.outcome == 'success')) }}
        run: |
          set -euo pipefail
          mode=retire
          [ "$HEALTH_VERIFIED" = true ] || mode=reconcile
          arn="$(aws ssm get-parameter --name /watchdog-bms/production/ecs-express-api-web-service-arn \
            --query Parameter.Value --output text --region "$AWS_REGION")"
          evidence="$DEPLOYMENT_EVIDENCE_DIR/api-web.json"
          [ -f "$evidence" ] || {
            echo 'ERROR: api-web rollout evidence is absent; durable recovery is required' >&2
            exit 1
          }
          validated="$(bash infra/prod-ecs-express/retirement-evidence.sh --file "$evidence" \
            --service-arn "$arn" --source-sha "$SOURCE_SHA" --region "$AWS_REGION" \
            --account "$AWS_ACCOUNT_ID" --cluster watchdog-bms-prod)"
          shopt -s nullglob
          files=("$DEPLOYMENT_EVIDENCE_DIR/history"/*.json)
          [ "${#files[@]}" -gt 0 ]
          export RELEASE_DEPLOYMENT_MANIFEST_JSON
          RELEASE_DEPLOYMENT_MANIFEST_JSON="$(jq -cs 'sort_by([.service,(.deploymentArn//""),.targetRevisionArn])' "${files[@]}")"
          if [ "$(jq -r '.noOp' <<< "$validated")" = true ]; then
            [ "$HEALTH_VERIFIED" = true ] || {
              echo 'ERROR: no-op release did not complete final verification' >&2
              exit 1
            }
            bash infra/prod-ecs-express/run-release-task.sh "$RELEASE_TASK_IMAGE" "$SOURCE_SHA" release-finalize
            exit 0
          fi
          deployment_arn="$(jq -er '.deploymentArn' <<< "$validated")"
          revision="$(jq -er '.targetRevisionArn' <<< "$validated")"
          active="$(bash infra/prod-ecs-express/active-launch-builds.sh --service-arn "$arn" \
            --deployment-arn "$deployment_arn" --target-revision-arn "$revision")"
          RETIRE_ACTIVE_BUILDS="$active" RETIRE_DEPLOYMENT_ARN="$deployment_arn" \
            RETIRE_SERVICE_ARN="$arn" RETIRE_TARGET_REVISION_ARN="$revision" \
            bash infra/prod-ecs-express/run-release-task.sh "$RELEASE_TASK_IMAGE" "$SOURCE_SHA" "$mode"

      - name: Finalize a non-api durable release
        if: always() && steps.refresh-finalize.outcome == 'success' && steps.release-prepare.outcome == 'success' && env.RELEASE_PARENT_OPERATION_ID != '' && steps.verify-health.outcome == 'success' && (env.EFFECTIVE_TARGET == 'ai-gateway' || env.EFFECTIVE_TARGET == 'workers')
        env:
          RELEASE_MODE: passport-promotion
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$DEPLOYMENT_EVIDENCE_DIR/history"/*.json)
          [ "${#files[@]}" -gt 0 ]
          export RELEASE_DEPLOYMENT_MANIFEST_JSON
          RELEASE_DEPLOYMENT_MANIFEST_JSON="$(jq -cs 'sort_by([.service,(.deploymentArn//""),.targetRevisionArn])' "${files[@]}")"
          bash infra/prod-ecs-express/run-release-task.sh "$RELEASE_TASK_IMAGE" "$SOURCE_SHA" release-finalize

      - name: Fail the requested promotion after a proved safe recovery
        if: always() && env.PROMOTION_SAFE_RECOVERY == 'true'
        run: |
          echo 'ERROR: requested Production state was not proved; exact candidate was recovered closed' >&2
          exit 1

      - name: Build, validate and sign Production Release Result V2
        if: steps.verify-health.outcome == 'success' && (inputs.requested_serving_mode == 'live' || steps.verify-maintenance.outcome == 'success')
        run: |
          set -euo pipefail
          result_dir="$PROMOTION_ROOT/production-release-result-v2"
          mkdir -m 700 "$result_dir"
          result="$result_dir/result.json"
          state=PROMOTED_LIVE
          [ "$FINAL_SERVING_MODE" = live ] || state=PROMOTED_CLOSED
          manifest_hash="$(sha256sum release/production-image-manifest.json|awk '{print $1}')"
          maintenance_hash=null
          maintenance_proof=-
          if [ -f "$DEPLOYMENT_EVIDENCE_DIR/maintenance-proof.json" ]; then
            maintenance_hash="\"$(sha256sum "$DEPLOYMENT_EVIDENCE_DIR/maintenance-proof.json"|awk '{print $1}')\""
            cp "$DEPLOYMENT_EVIDENCE_DIR/maintenance-proof.json" "$result_dir/maintenance-proof.json"
            maintenance_proof="$result_dir/maintenance-proof.json"
          fi
          completed="$(date -u +%s)"
          jq -cnS --arg source "$SOURCE_SHA" --arg state "$state" --arg mode "${{ inputs.requested_serving_mode }}" \
            --arg uat "${{ inputs.uat_run_id }}" --arg ready "$READY_RUN_ID" \
            --arg readySha "$READY_SHA256" --arg controller "$GITHUB_WORKFLOW_SHA" \
            --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --arg manifestSha "$manifest_hash" --arg target "$EFFECTIVE_TARGET" \
            --argjson maintenanceSha "$maintenance_hash" \
            --argjson completed "$completed" --slurpfile manifest release/production-image-manifest.json '
            {schemaVersion:2,artifactKind:"PRODUCTION_RELEASE_RESULT_V2",environment:"production",
             repository:env.GITHUB_REPOSITORY,sourceCommit:$source,state:$state,
             requestedServingMode:$mode,uatRunId:$uat,readinessRunId:$ready,readySha256:$readySha,
             effectiveTarget:$target,
             controllerCommit:$controller,productionRunId:$run,productionRunAttempt:$attempt,
             completedAtEpoch:$completed,manifestSha256:$manifestSha,images:$manifest[0].images,
             maintenanceProofSha256:$maintenanceSha}
          ' > "$PROMOTION_ROOT/result-body.json"
          content="$(jq -cjS . "$PROMOTION_ROOT/result-body.json"|sha256sum|awk '{print $1}')"
          jq -cS --arg hash "$content" '.+{contentSha256:$hash}' \
            "$PROMOTION_ROOT/result-body.json" > "$result"
          bash infra/security/validate-production-release-result-v2.sh "$result" \
            release/production-image-manifest.json "$READY_ROOT/ready.json" "$SOURCE_SHA" \
            "${{ inputs.uat_run_id }}" "$READY_RUN_ID" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKFLOW_SHA" "$GITHUB_REPOSITORY" "$(date -u +%s)" \
            "$maintenance_proof"
          cosign sign-blob --yes --bundle "$result_dir/result.bundle" "$result"
          cosign verify-blob --bundle "$result_dir/result.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-production-v2.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --certificate-github-workflow-trigger workflow_dispatch "$result"
          echo "PRODUCTION_RESULT_DIR=$result_dir" >> "$GITHUB_ENV"

      - name: Remove local legal evidence
        if: always() && env.LEGAL_EVIDENCE_DIR != ''
        run: |
          set -euo pipefail
          work="${LEGAL_EVIDENCE_DIR%/reviewed-evidence}"
          [[ "$work" == "$RUNNER_TEMP"/legal-release-evidence.* ]]
          test "$work" != "$RUNNER_TEMP"
          rm -rf -- "$work"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-v2-controller-evidence-${{ env.SOURCE_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ env.DEPLOYMENT_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.PRODUCTION_RESULT_DIR != ''
        with:
          name: production-release-result-v2-${{ env.SOURCE_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ env.PRODUCTION_RESULT_DIR }}
          if-no-files-found: error
          retention-days: 90
