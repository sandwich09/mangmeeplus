name: Production Security Preflight Evidence
run-name: Security preflight for production run ${{ inputs.parent_production_run_id }}

on:
  workflow_dispatch:
    inputs:
      parent_production_run_id:
        description: Exact in-progress deploy-production producer run ID
        required: true
        type: string
      uat_acceptance_run_id:
        description: Exact successful all-target deploy-uat producer run ID
        required: true
        type: string
      production_a5_pre_run_id:
        description: Exact successful PRODUCTION_A5_EVIDENCE_V1 PRE_MUTATION producer run ID
        required: true
        type: string
      production_a5_clone_run_id:
        description: Exact successful isolated production-clone rehearsal producer run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-security-preflight-${{ inputs.parent_production_run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only production security preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AWS_ACCOUNT_ID: "311414082667"
      AWS_REGION: ap-southeast-1
      EXPECTED_SECURITY_ROLE_ARN: arn:aws:iam::311414082667:role/watchdog-bms-production-security-readonly
      SECURITY_ROLE_NAME: watchdog-bms-production-security-readonly
      SECURITY_POLICY_NAME: watchdog-bms-production-security-readonly
      REDIS_REPLICATION_GROUP_ID: ${{ vars.REDIS_REPLICATION_GROUP_ID }}
      SECURITY_ALERT_TOPIC_ARN: ${{ vars.SECURITY_ALERT_TOPIC_ARN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Bind main controller and producer run IDs
        env:
          PARENT_RUN_ID: ${{ inputs.parent_production_run_id }}
          UAT_RUN_ID: ${{ inputs.uat_acceptance_run_id }}
          H2_RUN_ID: ${{ inputs.production_a5_pre_run_id }}
          CLONE_RUN_ID: ${{ inputs.production_a5_clone_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/production-security-preflight.yml@refs/heads/main"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          for run_id in "$PARENT_RUN_ID" "$UAT_RUN_ID" "$H2_RUN_ID" "$CLONE_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          test "$PARENT_RUN_ID" != "$UAT_RUN_ID"
          test "$PARENT_RUN_ID" != "$H2_RUN_ID"
          test "$UAT_RUN_ID" != "$H2_RUN_ID"
          test "$CLONE_RUN_ID" != "$PARENT_RUN_ID"
          test "$CLONE_RUN_ID" != "$UAT_RUN_ID"
          test "$CLONE_RUN_ID" != "$H2_RUN_ID"
          git fetch --no-tags origin "+refs/heads/main:refs/heads/main"
          test "$GITHUB_SHA" = "$(git rev-parse refs/heads/main)" || {
            echo "ERROR: obsolete security controller; dispatch the current main workflow" >&2
            exit 1
          }
          evidence_root="$RUNNER_TEMP/production-security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$evidence_root"
          echo "EVIDENCE_ROOT=$evidence_root" >> "$GITHUB_ENV"

      - name: Resolve and fully verify H2 PRE producer
        id: h2
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent_production_run_id }}
          H2_RUN_ID: ${{ inputs.production_a5_pre_run_id }}
        run: |
          set -euo pipefail
          source infra/security/signed-evidence.sh
          source infra/security/validate-production-security-preflight.sh
          parent_json="$EVIDENCE_ROOT/parent-run.json"
          h2_run_json="$EVIDENCE_ROOT/h2-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID" > "$parent_json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$H2_RUN_ID" > "$h2_run_json"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg run "$PARENT_RUN_ID" '
            (.id|tostring) == $run and .status == "in_progress" and .conclusion == null
            and .event == "workflow_dispatch" and .path == ".github/workflows/deploy-production.yml"
            and .head_branch == "main" and .repository.full_name == $repository
          ' "$parent_json" >/dev/null
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg run "$H2_RUN_ID" '
            (.id|tostring) == $run and .status == "completed" and .conclusion == "success"
            and .event == "workflow_dispatch" and .path == ".github/workflows/production-a5.yml"
            and .head_branch == "main" and .repository.full_name == $repository
          ' "$h2_run_json" >/dev/null
          parent_attempt="$(jq -er '.run_attempt|select(type=="number" and .>=1 and floor==.)' "$parent_json")"
          h2_attempt="$(jq -er '.run_attempt|select(type=="number" and .>=1 and floor==.)' "$h2_run_json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$H2_RUN_ID/artifacts?per_page=100" > "$EVIDENCE_ROOT/h2-all-artifacts.json"
          h2_name="$(jq -er --arg producer "$H2_RUN_ID" --argjson producerAttempt "$h2_attempt" \
            --arg parent "$PARENT_RUN_ID" --argjson parentAttempt "$parent_attempt" '
              select(.total_count == (.artifacts|length) and .total_count == 1)
              | .artifacts[0]
              | select(.expired == false and (.workflow_run.id|tostring) == $producer)
              | .name
              | select(test("^PRODUCTION_A5_EVIDENCE_V1-[0-9a-f]{40}-production-"+$parent+
                "-attempt-"+($parentAttempt|tostring)+"-producer-"+$producer+
                "-attempt-"+($producerAttempt|tostring)+"$"))
            ' "$EVIDENCE_ROOT/h2-all-artifacts.json")"
          source_sha="$(sed -E 's/^PRODUCTION_A5_EVIDENCE_V1-([0-9a-f]{40})-.*/\1/' <<< "$h2_name")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$H2_RUN_ID/artifacts" \
            -f name="$h2_name" -f per_page=100 > "$EVIDENCE_ROOT/h2-artifacts.json"
          h2_artifact_id="$(jq -er '.artifacts[0].id' "$EVIDENCE_ROOT/h2-artifacts.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$h2_artifact_id/zip" > "$EVIDENCE_ROOT/h2.zip"
          security_preflight_validate_artifact_metadata "$EVIDENCE_ROOT/h2-artifacts.json" \
            "$EVIDENCE_ROOT/h2.zip" "$h2_name" "$H2_RUN_ID" "$(jq -er '.head_sha' "$h2_run_json")" >/dev/null
          h2_dir="$(signed_evidence_extract_zip "$EVIDENCE_ROOT/h2.zip")"
          echo "H2_DIR=$h2_dir" >> "$GITHUB_ENV"

          h2_controller="$(jq -er '.head_sha|select(test("^[0-9a-f]{40}$"))' "$h2_run_json")"
          parent_controller="$(jq -er '.head_sha|select(test("^[0-9a-f]{40}$"))' "$parent_json")"
          h2_workflow_blob="$(git rev-parse "$h2_controller:.github/workflows/production-a5.yml")"
          parent_workflow_blob="$(git rev-parse "$parent_controller:.github/workflows/deploy-production.yml")"
          h2_started="$(jq -er '.run_started_at|fromdateiso8601' "$h2_run_json")"
          parent_started="$(jq -er '.run_started_at|fromdateiso8601' "$parent_json")"
          jq -cnS --arg source "$source_sha" --arg repository "$GITHUB_REPOSITORY" \
            --arg controller "$h2_controller" --arg workflowBlob "$h2_workflow_blob" \
            --arg run "$H2_RUN_ID" --argjson attempt "$h2_attempt" \
            --arg actor "$(jq -er '.actor.login' "$h2_run_json")" \
            --arg triggeringActor "$(jq -er '.triggering_actor.login' "$h2_run_json")" \
            --argjson started "$h2_started" --arg parentController "$parent_controller" \
            --arg parentBlob "$parent_workflow_blob" --arg parentRun "$PARENT_RUN_ID" \
            --argjson parentAttempt "$parent_attempt" --argjson parentStarted "$parent_started" '
              {artifactKind:"PRODUCTION_A5_EVIDENCE_V1",repository:$repository,environment:"production",
               sourceCommit:$source,producer:{workflowPath:".github/workflows/production-a5.yml",
                 controllerCommit:$controller,workflowBlob:$workflowBlob,runId:$run,runAttempt:$attempt,
                 actor:$actor,triggeringActor:$triggeringActor,startedAtEpoch:$started},
               parentProductionRun:{controllerCommit:$parentController,workflowBlob:$parentBlob,
                 runId:$parentRun,runAttempt:$parentAttempt,startedAtEpoch:$parentStarted},lifetimeSeconds:3600}
            ' > "$EVIDENCE_ROOT/h2-expected.json"
          h2_digest="$(jq -er '.artifacts[0].digest' "$EVIDENCE_ROOT/h2-artifacts.json")"
          jq -cnS --arg name "$h2_name" --arg run "$H2_RUN_ID" --argjson attempt "$h2_attempt" \
            --arg content "$(jq -er '.contentSha256' "$h2_dir/evidence.json")" --arg digest "$h2_digest" '
              {artifactKind:"PRODUCTION_A5_EVIDENCE_V1",producerRunId:$run,producerRunAttempt:$attempt,
               artifactName:$name,contentSha256:$content,artifactDigest:$digest}
            ' > "$EVIDENCE_ROOT/h2-ref.json"
          signed_evidence_verify_artifact "$EVIDENCE_ROOT/h2.zip" "$EVIDENCE_ROOT/h2-artifacts.json" \
            "$h2_run_json" "$parent_json" "$EVIDENCE_ROOT/h2-expected.json" \
            "$EVIDENCE_ROOT/h2-ref.json" "$GITHUB_WORKSPACE" "$(date -u +%s)"
          jq -e --arg source "$source_sha" '
            .sourceCommit == $source and .payload.stage == "PRE_MUTATION" and .payload.passed == true
          ' "$h2_dir/evidence.json" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "parent_attempt=$parent_attempt" >> "$GITHUB_OUTPUT"
          echo "parent_controller=$parent_controller" >> "$GITHUB_OUTPUT"
          echo "parent_workflow_blob=$parent_workflow_blob" >> "$GITHUB_OUTPUT"
          echo "parent_started=$parent_started" >> "$GITHUB_OUTPUT"

      - name: Fully verify the exact isolated clone rehearsal bound by H2
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent_production_run_id }}
          CLONE_RUN_ID: ${{ inputs.production_a5_clone_run_id }}
        run: |
          set -euo pipefail
          bash infra/security/fetch-verified-production-evidence.sh \
            PRODUCTION_A5_CLONE_REHEARSAL_V1 "$CLONE_RUN_ID" "$PARENT_RUN_ID" CLONE \
            "$EVIDENCE_ROOT/clone"
          cmp -s "$EVIDENCE_ROOT/clone/ref.json" \
            <(jq -cS '.payload.migrationState.verificationEvidence.cloneRehearsalRef' \
              "$H2_DIR/evidence.json") || {
            echo "ERROR: H2 PRE does not bind this exact clone artifact" >&2
            exit 1
          }

      - name: Download and verify exact signed UAT acceptance and release
        id: uat
        env:
          GH_TOKEN: ${{ github.token }}
          UAT_RUN_ID: ${{ inputs.uat_acceptance_run_id }}
          SOURCE_SHA: ${{ steps.h2.outputs.source_sha }}
        run: |
          set -euo pipefail
          source infra/security/validate-production-security-preflight.sh
          uat_run="$EVIDENCE_ROOT/uat-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UAT_RUN_ID" > "$uat_run"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg run "$UAT_RUN_ID" '
            (.id|tostring) == $run and .status == "completed" and .conclusion == "success"
            and .event == "workflow_dispatch" and .path == ".github/workflows/deploy-uat.yml"
            and .head_branch == "main" and .repository.full_name == $repository
          ' "$uat_run" >/dev/null
          uat_attempt="$(jq -er '.run_attempt|select(type=="number" and .>=1 and floor==.)' "$uat_run")"
          uat_controller="$(jq -er '.head_sha|select(test("^[0-9a-f]{40}$"))' "$uat_run")"
          acceptance_name="uat-deployment-acceptance-${SOURCE_SHA}-attempt-${uat_attempt}"
          release_name="uat-accepted-release-${SOURCE_SHA}-attempt-${uat_attempt}"
          for kind in acceptance release; do
            name="$acceptance_name"
            [ "$kind" = release ] && name="$release_name"
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$UAT_RUN_ID/artifacts" \
              -f name="$name" -f per_page=100 > "$EVIDENCE_ROOT/uat-${kind}-artifacts.json"
            artifact_id="$(jq -er '.artifacts[0].id' "$EVIDENCE_ROOT/uat-${kind}-artifacts.json")"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$EVIDENCE_ROOT/uat-${kind}.zip"
            security_preflight_validate_artifact_metadata "$EVIDENCE_ROOT/uat-${kind}-artifacts.json" \
              "$EVIDENCE_ROOT/uat-${kind}.zip" "$name" "$UAT_RUN_ID" "$uat_controller" >/dev/null
            extracted="$(security_preflight_extract_artifact "$kind" "$EVIDENCE_ROOT/uat-${kind}.zip")"
            if [ "$kind" = acceptance ]; then
              UAT_ACCEPTANCE_DIR="$extracted"
              echo "UAT_ACCEPTANCE_DIR=$extracted" >> "$GITHUB_ENV"
            else
              UAT_RELEASE_DIR="$extracted"
              echo "UAT_RELEASE_DIR=$extracted" >> "$GITHUB_ENV"
            fi
          done
          ci_blob="$(git rev-parse "$uat_controller:.github/workflows/ci.yml")"
          uat_blob="$(git rev-parse "$uat_controller:.github/workflows/deploy-uat.yml")"
          validator_hash="$(sha256sum infra/docker/validate-uat-deployment-acceptance.sh | awk '{print $1}')"
          cosign verify-blob \
            --bundle "$UAT_ACCEPTANCE_DIR/uat-deployment-acceptance.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-uat.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$uat_controller" \
            --certificate-github-workflow-trigger workflow_dispatch \
            "$UAT_ACCEPTANCE_DIR/uat-deployment-acceptance.json"
          bash infra/docker/validate-uat-deployment-acceptance.sh \
            "$UAT_ACCEPTANCE_DIR/uat-deployment-acceptance.json" \
            "$UAT_RELEASE_DIR/production-image-manifest.json" "$SOURCE_SHA" "$UAT_RUN_ID" \
            "$uat_attempt" "$uat_controller" "$GITHUB_REPOSITORY" "$ci_blob" "$uat_blob" \
            "$validator_hash" "$(date -u +%s)"
          acceptance_digest="$(jq -er '.artifacts[0].digest' "$EVIDENCE_ROOT/uat-acceptance-artifacts.json")"
          jq -cnS --arg run "$UAT_RUN_ID" --argjson attempt "$uat_attempt" --arg name "$acceptance_name" \
            --arg content "$(jq -er '.contentSha256' "$UAT_ACCEPTANCE_DIR/uat-deployment-acceptance.json")" \
            --arg digest "$acceptance_digest" '
              {artifactKind:"UAT_DEPLOYMENT_ACCEPTANCE",producerRunId:$run,producerRunAttempt:$attempt,
               artifactName:$name,contentSha256:$content,artifactDigest:$digest}
            ' > "$EVIDENCE_ROOT/uat-ref.json"
          echo "uat_controller=$uat_controller" >> "$GITHUB_OUTPUT"
          echo "ci_blob=$ci_blob" >> "$GITHUB_OUTPUT"
          echo "uat_blob=$uat_blob" >> "$GITHUB_OUTPUT"

      - name: Rehearse recovery and bind trusted controller files
        env:
          SOURCE_SHA: ${{ steps.h2.outputs.source_sha }}
          PARENT_CONTROLLER: ${{ steps.h2.outputs.parent_controller }}
          UAT_CONTROLLER: ${{ steps.uat.outputs.uat_controller }}
          CI_BLOB: ${{ steps.uat.outputs.ci_blob }}
          UAT_BLOB: ${{ steps.uat.outputs.uat_blob }}
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/deploy-production.yml \
            .github/workflows/recover-release-intent.yml \
            infra/prod-ecs-express/deploy.sh \
            infra/prod-ecs-express/release-safety.spec.sh \
            infra/prod-ecs-express/rollout-waves.spec.sh; do
            blob="$(git rev-parse "$SOURCE_SHA:$path")"
            test "$(git hash-object "$path")" = "$blob"
            jq -cnS --arg path "$path" --arg blob "$blob" '{path:$path,blob:$blob}'
          done | jq -csS 'sort_by(.path)' > "$EVIDENCE_ROOT/rollback-blobs.json"
          release_output="$EVIDENCE_ROOT/release-safety.out"
          rollout_output="$EVIDENCE_ROOT/rollout-waves.out"
          bash infra/prod-ecs-express/release-safety.spec.sh > "$release_output" 2>&1
          bash infra/prod-ecs-express/rollout-waves.spec.sh > "$rollout_output" 2>&1
          jq -cnS \
            --arg releaseHash "$(sha256sum "$release_output" | awk '{print $1}')" \
            --arg rolloutHash "$(sha256sum "$rollout_output" | awk '{print $1}')" '
              {mode:"NON_MUTATING_REHEARSAL",acceptanceHealthVerified:true,acceptanceReleaseFinalized:true,
               commands:[
                 {command:"bash infra/prod-ecs-express/release-safety.spec.sh",exitCode:0,outputSha256:$releaseHash},
                 {command:"bash infra/prod-ecs-express/rollout-waves.spec.sh",exitCode:0,outputSha256:$rolloutHash}
               ],protectedMainBlobs:[]}
            ' > "$EVIDENCE_ROOT/rollback.json"
          jq -cS --slurpfile blobs "$EVIDENCE_ROOT/rollback-blobs.json" \
            '.protectedMainBlobs=$blobs[0]' "$EVIDENCE_ROOT/rollback.json" > "$EVIDENCE_ROOT/rollback-final.json"
          mv "$EVIDENCE_ROOT/rollback-final.json" "$EVIDENCE_ROOT/rollback.json"
          test "$CI_BLOB" = "$(git rev-parse "$SOURCE_SHA:.github/workflows/ci.yml")"
          test "$UAT_BLOB" = "$(git rev-parse "$SOURCE_SHA:.github/workflows/deploy-uat.yml")"
          test "$(git rev-parse "$PARENT_CONTROLLER:.github/workflows/deploy-production.yml")" \
            = "$(git rev-parse "$SOURCE_SHA:.github/workflows/deploy-production.yml")"

      - name: Read live protected-main and production environment policy
        env:
          GH_POLICY_READ_TOKEN: ${{ secrets.PRODUCTION_POLICY_READ_TOKEN }}
          GH_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_POLICY_READ_TOKEN"
          policy_reader_status="$(curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_POLICY_READ_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$EVIDENCE_ROOT/policy-reader.json" --write-out '%{http_code}' \
            "$GITHUB_API_URL/user")"
          test "$policy_reader_status" = 200
          jq -e --arg owner "$GITHUB_REPOSITORY_OWNER" '.login == $owner' \
            "$EVIDENCE_ROOT/policy-reader.json" >/dev/null
          github_get() {
            local token="$1" path="$2" output="$3" status
            status="$(curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer $token" --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" --output "$output" \
              --write-out '%{http_code}' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$path")"
            test "$status" = 200
          }
          github_get "$GH_POLICY_READ_TOKEN" branches/main/protection "$EVIDENCE_ROOT/main-protection.json"
          github_get "$GH_ACTIONS_READ_TOKEN" environments/production "$EVIDENCE_ROOT/production-environment.json"
          github_get "$GH_ACTIONS_READ_TOKEN" 'environments/production/deployment-branch-policies?per_page=100' \
            "$EVIDENCE_ROOT/production-branch-policies.json"
          jq -cnS --slurpfile policy "$EVIDENCE_ROOT/main-protection.json" '
            ($policy[0]) as $p
            | {httpStatus:200,strictRequiredChecks:$p.required_status_checks.strict,
               requiredStatusContexts:(($p.required_status_checks.contexts // [])
                 + (($p.required_status_checks.checks // [])|map(.context)) | unique | sort),
               enforceAdmins:$p.enforce_admins.enabled,
               requiredPullRequestApprovals:$p.required_pull_request_reviews.required_approving_review_count,
               dismissStaleReviews:$p.required_pull_request_reviews.dismiss_stale_reviews,
               requireLastPushApproval:$p.required_pull_request_reviews.require_last_push_approval,
               forcePushAllowed:$p.allow_force_pushes.enabled,deletionAllowed:$p.allow_deletions.enabled}
          ' > "$EVIDENCE_ROOT/protected-main-facts.json"
          jq -cnS --slurpfile environment "$EVIDENCE_ROOT/production-environment.json" \
            --slurpfile branches "$EVIDENCE_ROOT/production-branch-policies.json" '
              ($environment[0]) as $e | ($branches[0]) as $b
              | select($b.total_count == ($b.branch_policies|length))
              | {environmentHttpStatus:200,branchPoliciesHttpStatus:200,
                 deploymentBranchPolicy:{protectedBranches:$e.deployment_branch_policy.protected_branches,
                   customBranchPolicies:$e.deployment_branch_policy.custom_branch_policies},
                 branchPolicies:($b.branch_policies|map({name,type})|sort_by(.name)),
                 requiredReviewerRules:(($e.protection_rules // [])
                   | map(select(.type == "required_reviewers")) | sort_by(.id)),
                 nativeReviewerRule:"NOT_CONFIGURED",nativeRequiredReviewerCount:0,
                 nativeSelfReviewPrevented:null,lastConfigurationHttpStatus:null}
          ' > "$EVIDENCE_ROOT/production-environment-facts.json"
          jq -e '.requiredReviewerRules == []' "$EVIDENCE_ROOT/production-environment-facts.json" >/dev/null

      - name: Configure exact read-only production security credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::311414082667:role/watchdog-bms-production-security-readonly
          aws-region: ap-southeast-1
          allowed-account-ids: "311414082667"
          role-session-name: production-security-${{ github.run_id }}

      - name: Read and verify immutable images, scans and AWS identity boundary
        env:
          SOURCE_SHA: ${{ steps.h2.outputs.source_sha }}
        run: |
          set -euo pipefail
          identity="$EVIDENCE_ROOT/aws-identity.json"
          role="$EVIDENCE_ROOT/aws-role.json"
          role_policy="$EVIDENCE_ROOT/aws-role-policy.json"
          aws sts get-caller-identity --output json > "$identity"
          aws iam get-role --role-name "$SECURITY_ROLE_NAME" --output json > "$role"
          aws iam get-role-policy --role-name "$SECURITY_ROLE_NAME" \
            --policy-name "$SECURITY_POLICY_NAME" --output json > "$role_policy"
          trust_template_hash="$(jq -cjS . infra/security/production-security-readonly-trust.template.json | sha256sum | awk '{print $1}')"
          policy_template_hash="$(jq -cjS . infra/security/production-security-readonly-policy.template.json | sha256sum | awk '{print $1}')"
          jq -cnS --slurpfile identity "$identity" --slurpfile role "$role" --slurpfile policy "$role_policy" \
            --arg expected "$EXPECTED_SECURITY_ROLE_ARN" --arg trustHash "$trust_template_hash" \
            --arg policyHash "$policy_template_hash" '
              {expectedRoleArn:$expected,callerAccount:$identity[0].Account,callerArn:$identity[0].Arn,
               callerUserId:$identity[0].UserId,roleArn:$role[0].Role.Arn,roleName:$role[0].Role.RoleName,
               inlinePolicyName:$policy[0].PolicyName,trustTemplateSha256:$trustHash,
               inlinePolicyTemplateSha256:$policyHash,trustPolicy:$role[0].Role.AssumeRolePolicyDocument,
               inlinePolicy:$policy[0].PolicyDocument}
            ' > "$EVIDENCE_ROOT/aws-facts.json"
          jq -e --slurpfile trust infra/security/production-security-readonly-trust.template.json \
            --slurpfile policy infra/security/production-security-readonly-policy.template.json '
              .expectedRoleArn == "arn:aws:iam::311414082667:role/watchdog-bms-production-security-readonly"
              and .roleArn == .expectedRoleArn
              and .trustPolicy == $trust[0] and .inlinePolicy == $policy[0]
            ' "$EVIDENCE_ROOT/aws-facts.json" >/dev/null

          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          manifest="$UAT_RELEASE_DIR/production-image-manifest.json"
          test "$(bash infra/docker/validate-production-manifest.sh "$manifest" "$AWS_ACCOUNT_ID" "$AWS_REGION")" = "$SOURCE_SHA"
          mkdir -p "$EVIDENCE_ROOT/services"
          for service in ai-gateway api-web workers; do
            row="$EVIDENCE_ROOT/services/${service}-manifest.json"
            jq -cS --arg service "$service" '.images[]|select(.service==$service)' "$manifest" > "$row"
            repository="$(jq -er '.repository' "$row")"
            image="$(jq -er '.image' "$row")"
            digest="$(jq -er '.digest' "$row")"
            ci_file="$UAT_RELEASE_DIR/cosign-${service}.json"
            sbom_file="$UAT_RELEASE_DIR/sbom-${service}.spdx.json"
            ci_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
            jq -e --arg digest "$digest" --arg identity "$ci_identity" '
              type == "array" and length >= 1
              and all(.[]; .critical.image["docker-manifest-digest"] == $digest
                and .optional.Subject == $identity
                and .optional.Issuer == "https://token.actions.githubusercontent.com")
            ' "$ci_file" >/dev/null
            live_signature="$EVIDENCE_ROOT/services/${service}-live-signature.json"
            cosign verify --certificate-identity "$ci_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image" > "$live_signature"
            jq -e --arg digest "$digest" --arg identity "$ci_identity" '
              type == "array" and length >= 1
              and all(.[]; .critical.image["docker-manifest-digest"] == $digest
                and .optional.Subject == $identity
                and .optional.Issuer == "https://token.actions.githubusercontent.com")
            ' "$live_signature" >/dev/null
            docker pull --platform linux/amd64 "$image" >/dev/null
            oci_revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            test "$oci_revision" = "$SOURCE_SHA"

            image_json="$EVIDENCE_ROOT/services/${service}-image.json"
            aws ecr batch-get-image --repository-name "$repository" --image-ids "imageDigest=$digest" \
              --accepted-media-types application/vnd.oci.image.index.v1+json \
                application/vnd.docker.distribution.manifest.list.v2+json \
                application/vnd.oci.image.manifest.v1+json \
                application/vnd.docker.distribution.manifest.v2+json --output json > "$image_json"
            jq -e --arg registry "$AWS_ACCOUNT_ID" --arg repository "$repository" --arg digest "$digest" '
              .failures == [] and (.images|length) == 1
              and .images[0].registryId == $registry and .images[0].repositoryName == $repository
              and .images[0].imageId.imageDigest == $digest
            ' "$image_json" >/dev/null
            media_type="$(jq -er '.images[0].imageManifestMediaType' "$image_json")"
            case "$media_type" in
              application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
                scan_digest="$(jq -er '.images[0].imageManifest|fromjson
                  | [.manifests[]|select(.platform.os=="linux" and .platform.architecture=="amd64")
                    | select((.annotations["vnd.docker.reference.type"]//"")!="attestation-manifest")]
                  | select(length==1)|.[0].digest' "$image_json")"
                ;;
              application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
                scan_digest="$digest" ;;
              *) echo "ERROR: unsupported image manifest media type $media_type" >&2; exit 1 ;;
            esac
            scan="$EVIDENCE_ROOT/services/${service}-scan.json"
            pushed="$EVIDENCE_ROOT/services/${service}-scan-source-describe.json"
            aws ecr describe-image-scan-findings --repository-name "$repository" \
              --image-id "imageDigest=$scan_digest" --output json > "$scan"
            aws ecr describe-images --repository-name "$repository" \
              --image-ids "imageDigest=$scan_digest" --output json > "$pushed"
            jq -e --arg registry "$AWS_ACCOUNT_ID" --arg repository "$repository" \
              --arg digest "$scan_digest" '
                .registryId == $registry and (.imageDetails|length) == 1
                and .imageDetails[0].registryId == $registry
                and .imageDetails[0].repositoryName == $repository
                and .imageDetails[0].imageDigest == $digest
              ' "$pushed" >/dev/null
            jq -e --arg registry "$AWS_ACCOUNT_ID" --arg repository "$repository" \
              --arg digest "$scan_digest" '
                .registryId == $registry and .repositoryName == $repository
                and .imageId.imageDigest == $digest
              ' "$scan" >/dev/null
            scan_provider_status="$(jq -er '.imageScanStatus.status' "$scan")"
            scan_provider_description_json="$(jq -cer \
              '.imageScanStatus.description|select(. == null or type=="string")' "$scan")"
            scan_provider_description="$(jq -r '.imageScanStatus.description // empty' "$scan")"
            scan_enhanced_findings_array="$(jq -er '.imageScanFindings.enhancedFindings|type=="array"' "$scan")"
            case "$scan_provider_status" in
              COMPLETE) ;;
              ACTIVE)
                test "$scan_provider_description" = 'Continuous scan is selected for image.'
                test "$scan_enhanced_findings_array" = true
                ;;
              *) echo "ERROR: ECR scan is not complete or continuously active: $scan_provider_status" >&2; exit 1 ;;
            esac
            scan_status=COMPLETE
            severity_counts="$(jq -cer '.imageScanFindings.findingSeverityCounts|select(type=="object")' "$scan")"
            scan_policy="$(jq -cer -f infra/docker/ecr-scan-blocking-findings.jq "$scan")"
            test "$(jq -r '.coverageComplete' <<< "$scan_policy")" = true
            scan_waivers="$(jq -cer '.waivers' <<< "$scan_policy")"
            critical="$(jq -r '[.blocking[]|select(.severity=="CRITICAL")]|length' <<< "$scan_policy")"
            high="$(jq -r '[.blocking[]|select(.severity=="HIGH")]|length' <<< "$scan_policy")"
            test "$critical" = 0
            test "$high" = 0
            pushed_epoch="$(date -u -d "$(jq -er '.imageDetails[0].imagePushedAt' "$pushed")" +%s)"
            scan_epoch="$(date -u -d "$(jq -er '.imageScanFindings.imageScanCompletedAt' "$scan")" +%s)"
            test "$scan_epoch" -ge "$pushed_epoch"
            jq -cnS --arg service "$service" --arg repository "$repository" --arg image "$image" \
              --arg digest "$digest" --arg source "$SOURCE_SHA" --arg identity "$ci_identity" \
              --arg sbomHash "$(sha256sum "$sbom_file" | awk '{print $1}')" \
              --arg spdx "$(jq -er '.spdxVersion|select(. == "SPDX-2.3")' "$sbom_file")" \
              --arg ciHash "$(sha256sum "$ci_file" | awk '{print $1}')" \
              --arg liveHash "$(sha256sum "$live_signature" | awk '{print $1}')" \
              --arg scanDigest "$scan_digest" --arg status "$scan_status" \
              --arg providerStatus "$scan_provider_status" \
              --argjson providerDescription "$scan_provider_description_json" \
              --argjson enhancedFindingsArray "$scan_enhanced_findings_array" \
              --argjson severityCounts "$severity_counts" \
              --argjson scanWaivers "$scan_waivers" \
              --argjson critical "$critical" --argjson high "$high" \
              --argjson pushed "$pushed_epoch" --argjson completed "$scan_epoch" '
                {service:$service,repository:$repository,image:$image,digest:$digest,sourceCommit:$source,
                 sbomFile:("sbom-"+$service+".spdx.json"),sbomSha256:$sbomHash,sbomSpdxVersion:$spdx,
                 ciSignatureFile:("cosign-"+$service+".json"),ciSignatureFileSha256:$ciHash,
                 ciSignerIdentity:$identity,ciIssuer:"https://token.actions.githubusercontent.com",ciSignedDigest:$digest,
                 liveSignerIdentity:$identity,liveIssuer:"https://token.actions.githubusercontent.com",
                 liveSignedDigest:$digest,liveSignatureOutputSha256:$liveHash,ociRevision:$source,
                 scanRequestedDigest:$digest,scanResolvedDigest:$scanDigest,scanStatus:$status,
                 scanProviderStatus:$providerStatus,scanProviderDescription:$providerDescription,
                 scanEnhancedFindingsArray:$enhancedFindingsArray,
                 scanSeverityCounts:$severityCounts,
                 scanWaivers:$scanWaivers,
                 critical:$critical,high:$high,imagePushedAtEpoch:$pushed,scanCompletedAtEpoch:$completed}
              ' > "$EVIDENCE_ROOT/services/${service}-facts.json"
          done
          jq -csS 'sort_by(.service)' "$EVIDENCE_ROOT/services/"*-facts.json > "$EVIDENCE_ROOT/services.json"

          tool_expected="$EVIDENCE_ROOT/clone/evidence.json"
          tool_image="$(jq -er '.payload.migrationTool.image' "$tool_expected")"
          tool_digest="$(jq -er '.payload.migrationTool.digest' "$tool_expected")"
          tool_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/production-a5-clone.yml@refs/heads/main"
          tool_root="$EVIDENCE_ROOT/migration-tool-live"
          bash infra/security/collect-production-a5-migration-tool-registry-evidence.sh \
            collect "$tool_image" "$SOURCE_SHA" "$tool_root"
          tool_registry="$tool_root/migration-tool.registry-facts.json"
          jq -e --slurpfile observed "$tool_registry" --arg source "$SOURCE_SHA" \
            --arg identity "$tool_identity" '
              .payload.migrationTool as $expected | $observed[0] as $live
              | $expected.image==$live.image and $expected.digest==$live.digest
                and $expected.sourceCommit==$source and $live.sourceCommit==$source
                and $expected.registryBinding==$live.registryBinding
                and $expected.sbom==$live.sbom and $expected.provenance==$live.provenance
                and $expected.signature.verified==true
                and $expected.signature.signedDigest==$live.digest
                and $expected.signature.identity==$identity
                and $expected.signature.issuer=="https://token.actions.githubusercontent.com"
            ' "$tool_expected" >/dev/null
          tool_signature="$tool_root/migration-tool.live-signature.json"
          cosign verify --certificate-identity "$tool_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$tool_image" > "$tool_signature"
          jq -e --arg digest "$tool_digest" --arg identity "$tool_identity" '
            type == "array" and length >= 1
            and all(.[]; .critical.image["docker-manifest-digest"] == $digest
              and .optional.Subject == $identity
              and .optional.Issuer == "https://token.actions.githubusercontent.com")
          ' "$tool_signature" >/dev/null
          docker pull --platform linux/amd64 "$tool_image" >/dev/null
          bash infra/security/verify-production-a5-migration-tool.sh "$tool_image" "$SOURCE_SHA"

          tool_scan_digest="$(jq -er '.registryBinding.runnableDigest' "$tool_registry")"
          tool_scan="$tool_root/migration-tool.scan.json"
          tool_pushed="$tool_root/migration-tool.describe.json"
          aws ecr describe-image-scan-findings --repository-name watchdog-bms-migration-tool \
            --image-id "imageDigest=$tool_scan_digest" --output json > "$tool_scan"
          aws ecr describe-images --repository-name watchdog-bms-migration-tool \
            --image-ids "imageDigest=$tool_scan_digest" --output json > "$tool_pushed"
          jq -e --arg digest "$tool_scan_digest" '
            .registryId=="311414082667" and (.imageDetails|length)==1
            and .imageDetails[0].repositoryName=="watchdog-bms-migration-tool"
            and .imageDetails[0].imageDigest==$digest
          ' "$tool_pushed" >/dev/null
          jq -e --arg digest "$tool_scan_digest" '
            .registryId=="311414082667" and .repositoryName=="watchdog-bms-migration-tool"
            and .imageId.imageDigest==$digest
          ' "$tool_scan" >/dev/null
          tool_provider_status="$(jq -er '.imageScanStatus.status' "$tool_scan")"
          tool_provider_description_json="$(jq -cer \
            '.imageScanStatus.description|select(. == null or type=="string")' "$tool_scan")"
          tool_provider_description="$(jq -r '.imageScanStatus.description // empty' "$tool_scan")"
          tool_enhanced_findings="$(jq -er '.imageScanFindings.enhancedFindings|type=="array"' "$tool_scan")"
          case "$tool_provider_status" in
            COMPLETE) ;;
            ACTIVE)
              test "$tool_provider_description" = 'Continuous scan is selected for image.'
              test "$tool_enhanced_findings" = true
              ;;
            *) echo "ERROR: migration-tool ECR scan is not complete or continuously active" >&2; exit 1 ;;
          esac
          tool_severity_counts="$(jq -cer '.imageScanFindings.findingSeverityCounts|select(type=="object")' "$tool_scan")"
          tool_scan_policy="$(jq -cer -f infra/docker/ecr-scan-blocking-findings.jq "$tool_scan")"
          test "$(jq -r '.coverageComplete' <<< "$tool_scan_policy")" = true
          tool_scan_waivers="$(jq -cer '.waivers' <<< "$tool_scan_policy")"
          tool_critical="$(jq -r '[.blocking[]|select(.severity=="CRITICAL")]|length' <<< "$tool_scan_policy")"
          tool_high="$(jq -r '[.blocking[]|select(.severity=="HIGH")]|length' <<< "$tool_scan_policy")"
          test "$tool_critical" = 0
          test "$tool_high" = 0
          tool_pushed_epoch="$(date -u -d "$(jq -er '.imageDetails[0].imagePushedAt' "$tool_pushed")" +%s)"
          tool_scan_epoch="$(date -u -d "$(jq -er '.imageScanFindings.imageScanCompletedAt' "$tool_scan")" +%s)"
          test "$tool_scan_epoch" -ge "$tool_pushed_epoch"
          jq -cnS --slurpfile registryFacts "$tool_registry" \
            --arg identity "$tool_identity" \
            --arg signatureHash "$(sha256sum "$tool_signature" | awk '{print $1}')" \
            --arg scanDigest "$tool_scan_digest" --arg providerStatus "$tool_provider_status" \
            --argjson providerDescription "$tool_provider_description_json" \
            --argjson enhancedFindingsArray "$tool_enhanced_findings" \
            --argjson severityCounts "$tool_severity_counts" \
            --argjson scanWaivers "$tool_scan_waivers" \
            --argjson critical "$tool_critical" --argjson high "$tool_high" \
            --argjson pushed "$tool_pushed_epoch" --argjson completed "$tool_scan_epoch" '
              $registryFacts[0] + {
                signature:{verified:true,signedDigest:$registryFacts[0].digest,identity:$identity,
                  issuer:"https://token.actions.githubusercontent.com",outputSha256:$signatureHash},
                scan:{requestedDigest:$registryFacts[0].digest,resolvedDigest:$scanDigest,status:"COMPLETE",
                  providerStatus:$providerStatus,providerDescription:$providerDescription,
                  enhancedFindingsArray:$enhancedFindingsArray,severityCounts:$severityCounts,
                  waivers:$scanWaivers,
                  critical:$critical,high:$high,imagePushedAtEpoch:$pushed,
                  scanCompletedAtEpoch:$completed}}
            ' > "$EVIDENCE_ROOT/migration-tool-verification.json"

          api_image="$(jq -er '.[]|select(.service=="api-web")|.image' "$EVIDENCE_ROOT/services.json")"
          clamav_now="$(date -u +%s)"
          bash infra/security/verify-production-security-baseline.sh clamav \
            "$api_image" "$SOURCE_SHA" "$EVIDENCE_ROOT/clamav-candidate.json" "$clamav_now"
          baseline_now="$(date -u +%s)"
          source_db_id="$(jq -er '.payload.cloneInfrastructure.sourceDbIdentifier' \
            "$EVIDENCE_ROOT/clone/evidence.json")"
          bash infra/security/verify-production-security-baseline.sh collect \
            "$EVIDENCE_ROOT/runtime-security-baseline.json" \
            "$EVIDENCE_ROOT/clamav-candidate.json" \
            docs/security-evidence/production-security-alert-delivery-ack.json \
            "$source_db_id" "$REDIS_REPLICATION_GROUP_ID" "$SECURITY_ALERT_TOPIC_ARN" \
            "$baseline_now" "$AWS_REGION"

      - name: Build, validate and sign exact security evidence
        id: emit
        env:
          SOURCE_SHA: ${{ steps.h2.outputs.source_sha }}
          PARENT_RUN_ID: ${{ inputs.parent_production_run_id }}
          PARENT_ATTEMPT: ${{ steps.h2.outputs.parent_attempt }}
          PARENT_CONTROLLER: ${{ steps.h2.outputs.parent_controller }}
          PARENT_WORKFLOW_BLOB: ${{ steps.h2.outputs.parent_workflow_blob }}
          PARENT_STARTED: ${{ steps.h2.outputs.parent_started }}
          CI_BLOB: ${{ steps.uat.outputs.ci_blob }}
          UAT_BLOB: ${{ steps.uat.outputs.uat_blob }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source infra/security/signed-evidence.sh
          test "$(git hash-object .github/workflows/production-security-preflight.yml)" \
            = "$(git rev-parse "$SOURCE_SHA:.github/workflows/production-security-preflight.yml")"
          validators="$EVIDENCE_ROOT/validators.json"
          for path in \
            infra/docker/ecr-scan-blocking-findings.jq \
            infra/docker/validate-production-manifest.sh \
            infra/docker/validate-uat-deployment-acceptance.sh \
            infra/security/collect-production-a5-migration-tool-registry-evidence.sh \
            infra/security/evidence-contracts.jq \
            infra/security/signed-evidence.sh \
            infra/security/validate-production-security-preflight.sh \
            infra/security/verify-production-a5-migration-tool.sh \
            infra/security/verify-production-security-baseline.sh; do
            test "$(git hash-object "$path")" = "$(git rev-parse "$SOURCE_SHA:$path")"
            jq -cnS --arg path "$path" --arg hash "$(sha256sum "$path" | awk '{print $1}')" \
              '{path:$path,sha256:$hash}'
          done | jq -csS 'sort_by(.path)' > "$validators"
          jq -cnS --arg source "$SOURCE_SHA" --arg producer "$GITHUB_SHA" \
            --arg parent "$PARENT_CONTROLLER" --arg ci "$CI_BLOB" --arg uat "$UAT_BLOB" \
            --arg production "$PARENT_WORKFLOW_BLOB" \
            --arg security "$(git rev-parse "$GITHUB_SHA:.github/workflows/production-security-preflight.yml")" \
            --slurpfile validators "$validators" '
              {sourceCommit:$source,producerControllerCommit:$producer,parentControllerCommit:$parent,
               ciWorkflowBlob:$ci,uatDeployWorkflowBlob:$uat,productionDeployWorkflowBlob:$production,
               securityPreflightWorkflowBlob:$security,validators:$validators[0]}
            ' > "$EVIDENCE_ROOT/controller-facts.json"
          jq -cnS --arg source "$SOURCE_SHA" \
            --arg acceptanceContent "$(jq -er '.contentSha256' "$UAT_ACCEPTANCE_DIR/uat-deployment-acceptance.json")" \
            --arg acceptanceFile "$(sha256sum "$UAT_ACCEPTANCE_DIR/uat-deployment-acceptance.json" | awk '{print $1}')" \
            --arg manifest "$(sha256sum "$UAT_RELEASE_DIR/production-image-manifest.json" | awk '{print $1}')" \
            --slurpfile services "$EVIDENCE_ROOT/services.json" '
              {sourceCommit:$source,uatAcceptanceContentSha256:$acceptanceContent,
               uatAcceptanceFileSha256:$acceptanceFile,releaseManifestSha256:$manifest,
               healthVerified:true,releaseFinalized:true,releaseFiles:[],services:$services[0]}
            ' > "$EVIDENCE_ROOT/artifact-facts.json"
          for name in cosign-ai-gateway.json cosign-api-web.json cosign-workers.json \
            production-image-manifest.json sbom-ai-gateway.spdx.json sbom-api-web.spdx.json sbom-workers.spdx.json; do
            jq -cnS --arg name "$name" --arg hash "$(sha256sum "$UAT_RELEASE_DIR/$name" | awk '{print $1}')" \
              '{name:$name,sha256:$hash}'
          done | jq -csS 'sort_by(.name)' > "$EVIDENCE_ROOT/release-files.json"
          jq -cS --slurpfile files "$EVIDENCE_ROOT/release-files.json" '.releaseFiles=$files[0]' \
            "$EVIDENCE_ROOT/artifact-facts.json" > "$EVIDENCE_ROOT/artifact-facts-final.json"
          mv "$EVIDENCE_ROOT/artifact-facts-final.json" "$EVIDENCE_ROOT/artifact-facts.json"
          jq -cnS --arg source "$SOURCE_SHA" --slurpfile uat "$EVIDENCE_ROOT/uat-ref.json" \
            --slurpfile h2 "$EVIDENCE_ROOT/h2-ref.json" \
            --slurpfile clone "$EVIDENCE_ROOT/clone/ref.json" \
            --slurpfile controller "$EVIDENCE_ROOT/controller-facts.json" \
            --slurpfile artifact "$EVIDENCE_ROOT/artifact-facts.json" --slurpfile rollback "$EVIDENCE_ROOT/rollback.json" \
            --slurpfile branch "$EVIDENCE_ROOT/protected-main-facts.json" \
            --slurpfile environment "$EVIDENCE_ROOT/production-environment-facts.json" \
            --slurpfile runtime "$EVIDENCE_ROOT/runtime-security-baseline.json" \
            --slurpfile aws "$EVIDENCE_ROOT/aws-facts.json" \
            --slurpfile migrationTool "$EVIDENCE_ROOT/migration-tool-verification.json" '
              {schemaVersion:1,sourceCommit:$source,uatAcceptanceRef:$uat[0],
               productionA5PreMutationRef:$h2[0],productionA5CloneRef:$clone[0],
               controllerTrust:$controller[0],
               artifactIntegrity:$artifact[0],migrationToolVerification:$migrationTool[0],
               rollbackRecovery:$rollback[0],
               protectedMainPolicy:$branch[0],productionEnvironmentPolicy:$environment[0],
               runtimeSecurityBaseline:$runtime[0],awsIdentityBoundary:$aws[0]}
            ' > "$EVIDENCE_ROOT/facts.json"
          bash infra/security/validate-production-security-preflight.sh build "$EVIDENCE_ROOT/facts.json" \
            "$H2_DIR/evidence.json" "$EVIDENCE_ROOT/clone/evidence.json" \
            "$EVIDENCE_ROOT/clone/ref.json" "$EVIDENCE_ROOT/payload.json"

          producer_run="$EVIDENCE_ROOT/producer-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$producer_run"
          producer_started="$(jq -er '.run_started_at|fromdateiso8601' "$producer_run")"
          workflow_blob="$(git rev-parse "$GITHUB_SHA:.github/workflows/production-security-preflight.yml")"
          jq -cnS --arg source "$SOURCE_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --arg controller "$GITHUB_SHA" --arg workflowBlob "$workflow_blob" --arg run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg actor "$GITHUB_ACTOR" \
            --arg triggeringActor "$GITHUB_TRIGGERING_ACTOR" --argjson started "$producer_started" \
            --arg parentController "$PARENT_CONTROLLER" --arg parentBlob "$PARENT_WORKFLOW_BLOB" \
            --arg parentRun "$PARENT_RUN_ID" --argjson parentAttempt "$PARENT_ATTEMPT" \
            --argjson parentStarted "$PARENT_STARTED" '
              {artifactKind:"PRODUCTION_SECURITY_PREFLIGHT_V1",repository:$repository,environment:"production",
               sourceCommit:$source,producer:{workflowPath:".github/workflows/production-security-preflight.yml",
                 controllerCommit:$controller,workflowBlob:$workflowBlob,runId:$run,runAttempt:$attempt,
                 actor:$actor,triggeringActor:$triggeringActor,startedAtEpoch:$started},
               parentProductionRun:{controllerCommit:$parentController,workflowBlob:$parentBlob,
                 runId:$parentRun,runAttempt:$parentAttempt,startedAtEpoch:$parentStarted},lifetimeSeconds:7200}
            ' > "$EVIDENCE_ROOT/expected.json"
          issued_at="$(date -u +%s)"
          expires_at="$((issued_at + 7200))"
          evidence_dir="$RUNNER_TEMP/production-security-evidence"
          mkdir -p "$evidence_dir"
          jq -cnS --arg repository "$GITHUB_REPOSITORY" --arg source "$SOURCE_SHA" \
            --arg controller "$GITHUB_SHA" --arg workflowBlob "$workflow_blob" --arg run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg actor "$GITHUB_ACTOR" \
            --arg triggeringActor "$GITHUB_TRIGGERING_ACTOR" --arg parentController "$PARENT_CONTROLLER" \
            --arg parentBlob "$PARENT_WORKFLOW_BLOB" --arg parentRun "$PARENT_RUN_ID" \
            --argjson parentAttempt "$PARENT_ATTEMPT" --argjson issued "$issued_at" \
            --argjson expires "$expires_at" --slurpfile payload "$EVIDENCE_ROOT/payload.json" '
              {schemaVersion:1,artifactKind:"PRODUCTION_SECURITY_PREFLIGHT_V1",repository:$repository,
               environment:"production",sourceCommit:$source,
               producer:{workflowPath:".github/workflows/production-security-preflight.yml",
                 workflowRef:"refs/heads/main",controllerCommit:$controller,workflowBlob:$workflowBlob,
                 runId:$run,runAttempt:$attempt,event:"workflow_dispatch",actor:$actor,triggeringActor:$triggeringActor},
               parentProductionRun:{workflowPath:".github/workflows/deploy-production.yml",
                 controllerCommit:$parentController,workflowBlob:$parentBlob,runId:$parentRun,
                 runAttempt:$parentAttempt},issuedAtEpoch:$issued,expiresAtEpoch:$expires,payload:$payload[0]}
            ' > "$evidence_dir/body.json"
          content_hash="$(signed_evidence_content_sha256 "$evidence_dir/body.json")"
          jq -cS --arg hash "$content_hash" '. + {contentSha256:$hash}' \
            "$evidence_dir/body.json" > "$evidence_dir/evidence.json"
          rm "$evidence_dir/body.json"
          signed_evidence_validate_payload_contract "$evidence_dir/evidence.json"
          signed_evidence_validate_envelope "$evidence_dir/evidence.json" "$EVIDENCE_ROOT/expected.json" "$issued_at"
          signed_evidence_validate_parent_github_run "$EVIDENCE_ROOT/parent-run.json" "$EVIDENCE_ROOT/expected.json"
          signed_evidence_validate_git_trust "$GITHUB_WORKSPACE" "$EVIDENCE_ROOT/expected.json"
          cosign sign-blob --yes --bundle "$evidence_dir/evidence.bundle" "$evidence_dir/evidence.json"
          signed_evidence_verify_cosign "$evidence_dir/evidence.json" "$evidence_dir/evidence.bundle" \
            "$EVIDENCE_ROOT/expected.json" >/dev/null
          test "$(find "$evidence_dir" -mindepth 1 -maxdepth 1 -printf '%f:%y\n' | LC_ALL=C sort)" \
            = $'evidence.bundle:f\nevidence.json:f'
          artifact_name="$(signed_evidence_artifact_name "$EVIDENCE_ROOT/expected.json")"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.emit.outputs.artifact_name }}
          path: ${{ runner.temp }}/production-security-evidence
          if-no-files-found: error
          retention-days: 7
