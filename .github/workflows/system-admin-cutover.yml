name: Production System Admin Cutover
run-name: ${{ inputs.operation }} System Admin ${{ inputs.username }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: ADD the replacement first; REVOKE only after its password was changed
        required: true
        type: choice
        options:
          - ADD
          - REVOKE
      uat_run_id:
        description: Exact successful UAT run carrying UAT_RELEASE_PASSPORT_V2
        required: true
        type: string
      username:
        description: Fresh replacement System Admin username
        required: true
        default: prodmangmeeplus
        type: string
      display_name:
        description: Replacement account display name
        required: true
        default: MangmeePlus Production System Admin
        type: string
      source_username:
        description: REVOKE only — protected old System Admin username
        required: false
        type: string
      approval_ref:
        description: Auditable owner-approved reference
        required: true
        default: owner-approved:2026-08-25:system-admin-cutover
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: watchdog-bms-production-deploy
  cancel-in-progress: false

jobs:
  cutover:
    name: Run constrained Production System Admin cutover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      AWS_ACCOUNT_ID: '311414082667'
      AWS_REGION: ap-southeast-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      DEPLOY_ENV: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Bind repository owner, protected main, and exact signed UAT Passport
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_UAT_RUN_ID: ${{ inputs.uat_run_id }}
          INPUT_USERNAME: ${{ inputs.username }}
          INPUT_DISPLAY_NAME: ${{ inputs.display_name }}
          INPUT_SOURCE_USERNAME: ${{ inputs.source_username }}
          INPUT_APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          git fetch --no-tags origin main --force
          test "$GITHUB_WORKFLOW_SHA" = "$(git rev-parse origin/main)"
          owner="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.login')"
          test "$GITHUB_ACTOR" = "$owner"
          test "$GITHUB_TRIGGERING_ACTOR" = "$owner"
          [[ "$INPUT_UAT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INPUT_USERNAME" =~ ^[a-z][a-z0-9._-]{2,63}$ ]]
          test -n "$INPUT_DISPLAY_NAME"; test "${#INPUT_DISPLAY_NAME}" -le 120
          [[ "$INPUT_APPROVAL_REF" =~ ^owner-approved:[A-Za-z0-9][A-Za-z0-9._:/@+=,-]{7,239}$ ]]
          case "$INPUT_OPERATION" in
            ADD) test -z "$INPUT_SOURCE_USERNAME" ;;
            REVOKE)
              [[ "$INPUT_SOURCE_USERNAME" =~ ^[a-z][a-z0-9._-]{2,63}$ ]]
              test "$INPUT_SOURCE_USERNAME" != "$INPUT_USERNAME"
              ;;
            *) exit 2 ;;
          esac

          root="$RUNNER_TEMP/system-admin-cutover"
          mkdir -m 700 -p "$root"
          run_json="$root/uat-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_UAT_RUN_ID" > "$run_json"
          jq -e --arg run "$INPUT_UAT_RUN_ID" --arg repository "$GITHUB_REPOSITORY" '
            (.id|tostring)==$run and .status=="completed" and .conclusion=="success"
            and .event=="workflow_dispatch" and .path==".github/workflows/deploy-uat.yml"
            and .head_branch=="main" and .repository.full_name==$repository
          ' "$run_json" >/dev/null
          attempt="$(jq -er '.run_attempt|select(type=="number" and floor==. and .>=1)' "$run_json")"
          controller="$(jq -er '.head_sha|select(test("^[0-9a-f]{40}$"))' "$run_json")"
          artifacts="$root/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_UAT_RUN_ID/artifacts?per_page=100" > "$artifacts"
          passport_name="$(jq -er --argjson attempt "$attempt" '
            [.artifacts[] | select(.expired==false) | .name
              | capture("^uat-release-passport-v2-(?<sha>[0-9a-f]{40})-attempt-(?<attempt>[1-9][0-9]*)$")
              | select((.attempt|tonumber)==$attempt)]
            | select(length==1) | .[0] | "uat-release-passport-v2-"+.sha+"-attempt-"+.attempt
          ' "$artifacts")"
          source_sha="${passport_name#uat-release-passport-v2-}"
          source_sha="${source_sha%-attempt-*}"
          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor "$source_sha" origin/main

          metadata="$root/passport-artifact.json"
          archive="$root/passport.zip"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_UAT_RUN_ID/artifacts" \
            -f name="$passport_name" -f per_page=100 > "$metadata"
          artifact_id="$(jq -er 'select(.total_count==1 and (.artifacts|length)==1)
            | .artifacts[0] | select(.expired==false) | .id' "$metadata")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
          source infra/security/validate-production-security-preflight.sh
          security_preflight_validate_artifact_metadata "$metadata" "$archive" "$passport_name" \
            "$INPUT_UAT_RUN_ID" "$controller" >/dev/null
          passport_root="$(security_preflight_extract_artifact passport-v2 "$archive")"
          cosign verify-blob --bundle "$passport_root/passport.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-uat.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$controller" \
            --certificate-github-workflow-trigger workflow_dispatch "$passport_root/passport.json"
          bash infra/security/validate-uat-release-passport-v2.sh \
            "$passport_root/passport.json" "$passport_root" "$source_sha" "$INPUT_UAT_RUN_ID" \
            "$attempt" "$controller" "$GITHUB_REPOSITORY" "$AWS_ACCOUNT_ID" "$AWS_REGION" \
            "$(date -u +%s)"
          release_image="$(jq -er '.tools[]|select(.purpose=="release-task")|.image' "$passport_root/passport.json")"
          printf '%s\n' "SOURCE_SHA=$source_sha" "RELEASE_TASK_IMAGE=$release_image" \
            "CUTOVER_ROOT=$root" >> "$GITHUB_ENV"
      - name: Configure mutation-capable Production task controller
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: production-system-admin-${{ github.run_id }}
          unset-current-credentials: true
      - name: Verify immutable executor and resolve secret reference
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          identity="$(aws sts get-caller-identity --output json)"
          jq -e --arg account "$AWS_ACCOUNT_ID" '.Account==$account' <<< "$identity" >/dev/null
          repository="${RELEASE_TASK_IMAGE#*/}"; repository="${repository%%@*}"
          digest="${RELEASE_TASK_IMAGE##*@}"
          aws ecr describe-images --repository-name "$repository" --image-ids "imageDigest=$digest" \
            --query 'imageDetails[0].imageDigest' --output text | grep -Fx "$digest" >/dev/null
          aws ecr get-login-password \
            | docker login --username AWS --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >/dev/null
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RELEASE_TASK_IMAGE" >/dev/null
          if [ "$INPUT_OPERATION" = ADD ]; then
            secret_arn="$(aws secretsmanager describe-secret \
              --secret-id watchdog-bms/production/system-admin-cutover-password \
              --query ARN --output text)"
            printf 'SYSTEM_ADMIN_PASSWORD_SECRET_ARN=%s\n' "$secret_arn" >> "$GITHUB_ENV"
          fi
      - name: Run fixed cutover command and validate secret-free evidence
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          ADMIN_USERNAME: ${{ inputs.username }}
          ADMIN_DISPLAY_NAME: ${{ inputs.display_name }}
          ADMIN_SOURCE_USERNAME: ${{ inputs.source_username }}
          SYSTEM_ADMIN_CUTOVER_APPROVAL_REF: ${{ inputs.approval_ref }}
        run: |
          set -euo pipefail
          mode=system-admin-add
          [ "$INPUT_OPERATION" = REVOKE ] && mode=system-admin-revoke
          log="$CUTOVER_ROOT/task.log"
          bash infra/prod-ecs-express/run-release-task.sh \
            "$RELEASE_TASK_IMAGE" "$SOURCE_SHA" "$mode" | tee "$log"
          evidence="$CUTOVER_ROOT/evidence.json"
          node - "$log" "$evidence" <<'NODE'
          const fs = require('node:fs');
          const [log, output] = process.argv.slice(2);
          const candidates = fs.readFileSync(log, 'utf8').split(/[\r\n\t]+/);
          const found = candidates.flatMap((line) => {
            const start = line.indexOf('{"artifact":"system-admin-cutover"');
            if (start < 0) return [];
            try { return [JSON.parse(line.slice(start))]; } catch { return []; }
          });
          if (found.length !== 1) throw new Error(`expected one cutover evidence object, got ${found.length}`);
          fs.writeFileSync(output, `${JSON.stringify(found[0])}\n`, { mode: 0o600 });
          NODE
          jq -e --arg operation "$INPUT_OPERATION" --arg username "$ADMIN_USERNAME" \
            --arg source "$SOURCE_SHA" '
            .artifact=="system-admin-cutover" and .schemaVersion==1
            and .environment=="production" and .operation==$operation
            and .username==$username and .sourceCommit==$source
            and .role=="SYSTEM_ADMIN"
            and (if $operation=="ADD" then
              (.result=="CREATED" or .result=="REPLAY")
              and .credentialStatus=="TEMPORARY" and .mustChangePassword==true
              and .temporaryLoginVerified==true
            else
              (.result=="REVOKED" or .result=="REPLAY")
              and .credentialStatus=="DISABLED" and .activeSessionCount==0
            end)
          ' "$evidence" >/dev/null
          evidence_dir="$CUTOVER_ROOT/signed-evidence"
          mkdir -m 700 "$evidence_dir"
          cp "$evidence" "$evidence_dir/evidence.json"
          cosign sign-blob --yes --bundle "$evidence_dir/evidence.bundle" "$evidence_dir/evidence.json"
          cosign verify-blob --bundle "$evidence_dir/evidence.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/system-admin-cutover.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$evidence_dir/evidence.json"
          printf 'SIGNED_EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          if [ "$INPUT_OPERATION" = ADD ]; then
            echo 'Temporary password location: watchdog-bms/production/system-admin-cutover-password' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-system-admin-cutover-${{ inputs.operation }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.SIGNED_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
