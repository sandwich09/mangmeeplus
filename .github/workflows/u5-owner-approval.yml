name: U5 Production Owner Approval
run-name: Owner approval for production run ${{ inputs.parent_production_run_id }}

on:
  workflow_dispatch:
    inputs:
      parent_production_run_id:
        description: Exact in-progress deploy-production run ID
        required: true
        type: string
      pre_aggregate_run_id:
        description: Exact successful PRE_AUTHORIZATION aggregate producer run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: u5-owner-approval-${{ inputs.parent_production_run_id }}
  cancel-in-progress: false

jobs:
  approve:
    name: Sign exact attempt-bound owner authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-approval
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.workflow_sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Require the repository owner on current protected main
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent_production_run_id }}
          PRE_AGGREGATE_RUN_ID: ${{ inputs.pre_aggregate_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/u5-owner-approval.yml@refs/heads/main"
          test "$GITHUB_SHA" = "$GITHUB_WORKFLOW_SHA"
          [[ "$PARENT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PRE_AGGREGATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$PARENT_RUN_ID" != "$PRE_AGGREGATE_RUN_ID"
          git fetch --no-tags origin '+refs/heads/main:refs/heads/main'
          test "$GITHUB_SHA" = "$(git rev-parse refs/heads/main)" || {
            echo "ERROR: obsolete owner controller; dispatch current protected main" >&2
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/repository.json"
          repository_owner="$(jq -er '.owner.login' "$RUNNER_TEMP/repository.json")"
          test "$GITHUB_ACTOR" = "$repository_owner"
          test "$GITHUB_TRIGGERING_ACTOR" = "$repository_owner"
          echo "REPOSITORY_OWNER_LOGIN=$repository_owner" >> "$GITHUB_ENV"
          root="$RUNNER_TEMP/u5-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$root"
          echo "EVIDENCE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Fully verify exact PRE aggregate bytes and lineage
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ inputs.parent_production_run_id }}
          PRE_AGGREGATE_RUN_ID: ${{ inputs.pre_aggregate_run_id }}
        run: |
          set -euo pipefail
          bash infra/security/fetch-verified-production-evidence.sh U5_SHADOW_AGGREGATE_V1 \
            "$PRE_AGGREGATE_RUN_ID" "$PARENT_RUN_ID" PRE_AUTHORIZATION "$EVIDENCE_ROOT/pre"
          issued_at="$(date -u +%s)"
          parent_attempt="$(jq -er '.run_attempt' "$EVIDENCE_ROOT/pre/parent-run.json")"
          bash infra/security/validate-u5-production-chain.sh approval \
            "$EVIDENCE_ROOT/pre/evidence.json" "$EVIDENCE_ROOT/pre/ref.json" \
            "$REPOSITORY_OWNER_LOGIN" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$parent_attempt" "$issued_at" "$EVIDENCE_ROOT/payload.json"
          echo "APPROVAL_ISSUED_AT=$issued_at" >> "$GITHUB_ENV"
      - name: Canonicalize, validate, sign and verify owner authority
        env:
          PARENT_RUN_ID: ${{ inputs.parent_production_run_id }}
        run: |
          set -euo pipefail
          source infra/security/signed-evidence.sh
          parent="$EVIDENCE_ROOT/pre/parent-run.json"
          parent_attempt="$(jq -er '.run_attempt' "$parent")"
          source_sha="$(jq -er '.head_sha' "$parent")"
          issued_at="$APPROVAL_ISSUED_AT"
          producer_blob="$(git rev-parse "$GITHUB_SHA:.github/workflows/u5-owner-approval.yml")"
          parent_blob="$(git rev-parse "$source_sha:.github/workflows/deploy-production.yml")"
          evidence_dir="$EVIDENCE_ROOT/signed"
          mkdir -m 700 "$evidence_dir"
          jq -cnS --slurpfile payload "$EVIDENCE_ROOT/payload.json" \
            --arg repository "$GITHUB_REPOSITORY" --arg source "$source_sha" \
            --arg controller "$GITHUB_SHA" --arg producerBlob "$producer_blob" \
            --arg run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --arg owner "$REPOSITORY_OWNER_LOGIN" --arg parentController "$source_sha" \
            --arg parentBlob "$parent_blob" --arg parentRun "$PARENT_RUN_ID" \
            --argjson parentAttempt "$parent_attempt" --argjson issued "$issued_at" \
            --argjson expires "$((issued_at + 1800))" '
              {schemaVersion:1,artifactKind:"OWNER_U5E_APPROVAL_V1",repository:$repository,
               environment:"production",sourceCommit:$source,
               producer:{workflowPath:".github/workflows/u5-owner-approval.yml",workflowRef:"refs/heads/main",
                 controllerCommit:$controller,workflowBlob:$producerBlob,runId:$run,runAttempt:$attempt,
                 event:"workflow_dispatch",actor:$owner,triggeringActor:$owner},
               parentProductionRun:{workflowPath:".github/workflows/deploy-production.yml",
                 controllerCommit:$parentController,workflowBlob:$parentBlob,runId:$parentRun,
                 runAttempt:$parentAttempt},issuedAtEpoch:$issued,expiresAtEpoch:$expires,
               payload:$payload[0],contentSha256:("0"*64)}
            ' > "$EVIDENCE_ROOT/unhashed.json"
          content_hash="$(signed_evidence_content_sha256 "$EVIDENCE_ROOT/unhashed.json")"
          jq -cS --arg hash "$content_hash" '.contentSha256=$hash' "$EVIDENCE_ROOT/unhashed.json" \
            > "$evidence_dir/evidence.json"
          signed_evidence_validate_payload_contract "$evidence_dir/evidence.json"
          test "$(signed_evidence_content_sha256 "$evidence_dir/evidence.json")" = "$content_hash"
          cosign sign-blob --yes --bundle "$evidence_dir/evidence.bundle" "$evidence_dir/evidence.json"
          cosign verify-blob --bundle "$evidence_dir/evidence.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/u5-owner-approval.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --certificate-github-workflow-trigger workflow_dispatch "$evidence_dir/evidence.json" >/dev/null
          test "$(find "$evidence_dir" -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" \
            = 'evidence.bundle evidence.json '
          artifact_name="OWNER_U5E_APPROVAL_V1-${source_sha}-production-${PARENT_RUN_ID}-attempt-${parent_attempt}-producer-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          echo "OWNER_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "OWNER_SIGNED_DIR=$evidence_dir" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ${{ env.OWNER_ARTIFACT_NAME }}
          path: |
            ${{ env.OWNER_SIGNED_DIR }}/evidence.json
            ${{ env.OWNER_SIGNED_DIR }}/evidence.bundle
          if-no-files-found: error
          retention-days: 7
