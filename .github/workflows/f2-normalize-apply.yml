# F2 / CC7 legacy entitlement normalization — HALF TWO: the WRITE (UAT r7 item 2).
#
# The pause between planning and writing is this dispatch. A human opens the artifact produced by
# f2-normalize.yml, reads it, and then starts this workflow naming that run. There is no reliance on
# a required reviewer: the uat and production GitHub environments have none, which is exactly why the
# old single-dispatch "dry-run job, then an approval-gated apply job" never actually paused.
#
# The operator supplies only WHICH plan (environment + plan_run_id). Everything the write is bound to
# — the commit, the release-task image, and the approved aggregate hash — is read out of that run's
# artifact, so there is no hash to copy and no way to apply a plan nobody produced. The normalizer
# re-plans read-only before writing and halts with ZERO writes if the estate moved since the plan.
#
# VERIFY always runs after the apply: an independent read-only re-check that the fixed point and the
# grandfather provenance actually landed.
name: F2 Entitlement Normalization APPLY
run-name: F2 apply ${{ inputs.environment }} from plan run ${{ inputs.plan_run_id }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (must match the plan artifact)
        required: true
        default: uat
        type: choice
        options:
          - uat
          - production
      plan_run_id:
        description: Run ID of the F2 PLAN run whose artifact you reviewed
        required: true
        type: string

permissions:
  actions: read
  contents: read

# UAT r7 item 3 — the SAME group string the deploy workflows use for this environment
# (watchdog-bms-uat-deploy / watchdog-bms-production-deploy). GitHub serialises only identical group
# names, so anything less exact would let a deploy's release task and this write touch one estate at
# the same time.
concurrency:
  group: watchdog-bms-${{ inputs.environment }}-deploy
  cancel-in-progress: false

jobs:
  apply:
    name: F2 Apply + Verify (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ENV: ${{ inputs.environment }}
    steps:
      - name: Require the default-branch controller
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "ERROR: dispatch the F2 controller from main" >&2
            exit 1
          }
          test "$DEPLOY_ENV" = "uat" || {
            echo "ERROR: A5/F2 is locked to isolated UAT until a separate production read-only principal and promotion review exist" >&2
            exit 1
          }
      - name: Require a numeric plan run id
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "ERROR: plan_run_id must be the numeric run ID of an F2 PLAN run" >&2
            exit 1
          }
      - name: Verify the named PLAN run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" > "$RUNNER_TEMP/f2-plan-run.json"
          jq -e --arg repository "$GITHUB_REPOSITORY" '
            .event == "workflow_dispatch"
            and .conclusion == "success"
            and .path == ".github/workflows/f2-normalize.yml"
            and .head_repository.full_name == $repository
          ' "$RUNNER_TEMP/f2-plan-run.json" > /dev/null || {
            echo "ERROR: plan_run_id is not a successful F2 PLAN workflow_dispatch in this repository" >&2
            exit 1
          }
      # Downloaded to the runner temp dir, NOT the workspace: the checkout below cleans the
      # workspace, and this artifact is the authority for which commit to check out.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: f2-plan-${{ inputs.environment }}
          path: ${{ runner.temp }}/f2-plan
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Read the reviewed plan
        id: plan
        env:
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/f2-plan/f2-plan.json"
          test -f "$plan"
          jq -e '.artifact == "f2-plan" and .schemaVersion == 2' "$plan" > /dev/null
          fail() { echo "ERROR: $1" >&2; exit 1; }
          environment="$(jq -r '.environment' "$plan")"
          [ "$environment" = "$DEPLOY_ENV" ] \
            || fail "this plan was produced for '$environment', not '$DEPLOY_ENV'"
          # The artifact names its own run, so a plan cannot be passed off as another run's.
          plan_run_id="$(jq -r '.planRunId' "$plan")"
          [ "$plan_run_id" = "$PLAN_RUN_ID" ] \
            || fail "the artifact was produced by run $plan_run_id, not $PLAN_RUN_ID"
          [ "$(jq -r '.repository' "$plan")" = "$GITHUB_REPOSITORY" ] \
            || fail "the plan belongs to another repository"
          [ "$(jq -r '.controllerSha' "$plan")" = "$(jq -r '.head_sha' "$RUNNER_TEMP/f2-plan-run.json")" ] \
            || fail "the plan controller SHA does not match its GitHub run"
          [ "$(jq -r '.controllerSha' "$plan")" = "$GITHUB_SHA" ] \
            || fail "the F2 controller changed after PLAN; re-plan before applying"
          [ "$(jq -r '.planRunAttempt' "$plan")" = "$(jq -r '.run_attempt | tostring' "$RUNNER_TEMP/f2-plan-run.json")" ] \
            || fail "the plan artifact is from another run attempt"
          [ "$(jq -r '.planActorId' "$plan")" = "$(jq -r '.actor.id | tostring' "$RUNNER_TEMP/f2-plan-run.json")" ] \
            || fail "the plan actor does not match its GitHub run"
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/f2-normalize.yml@refs/heads/main"
          [ "$(jq -r '.workflowRef' "$plan")" = "$expected_workflow_ref" ] \
            || fail "the plan was not produced by the main-branch F2 controller"
          release_ref="$(jq -r '.releaseRef' "$plan")"
          [[ "$release_ref" =~ ^[0-9a-f]{40}$ ]] || fail "the plan carries no full commit SHA"
          jq -e --arg sha "$release_ref" '
            .approvalReady == true
            and .a5.artifact == "a5-readonly-evidence"
            and .a5.schemaVersion == 1
            and .a5.targetEnvironment == "uat"
            and .a5.sourceCommit == $sha
            and .a5.readOnly == true
            and .a5.f2PrecheckReady == true
            and (.a5.f2PrecheckBlockers | length) == 0
            and (.a5.queryCatalogHash | type == "string" and test("^[0-9a-f]{64}$"))
            and (.a5.evidenceHash | type == "string" and test("^[0-9a-f]{64}$"))
          ' "$plan" >/dev/null || fail "the reviewed plan has no clean, exact-SHA A5 read-only precheck"
          jq -cSj '.a5 | del(.generatedAt,.evidenceHash)' "$plan" > "$RUNNER_TEMP/a5-approved-canonical.json"
          a5_evidence_hash="$(sha256sum "$RUNNER_TEMP/a5-approved-canonical.json" | awk '{print $1}')"
          [ "$a5_evidence_hash" = "$(jq -r '.a5.evidenceHash' "$plan")" ] \
            || fail "the reviewed A5 evidence hash does not match its canonical payload"
          release_image="$(jq -r '.releaseImage' "$plan")"
          expected_registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          digest="${release_image#"$expected_registry/watchdog-bms-api@"}"
          [ "$release_image" = "$expected_registry/watchdog-bms-api@$digest" ] \
            && [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || fail "the plan carries no release-task image digest"
          # THE approval. Read from the artifact, never typed by the operator.
          aggregate_hash="$(jq -r '.aggregateHash' "$plan")"
          [[ "$aggregate_hash" =~ ^[0-9a-f]{64}$ ]] || fail "the plan carries no aggregateHash"
          # The normalizer binds each company to the plan hash it was reviewed under, so the write is
          # authorized by the artifact's approval fields, not by the aggregate alone. Refuse a plan
          # that was never appliable here, where the message can name the fix.
          jq -e '.approval.artifact == "f2-entitlement-normalization"
                 and (.approval.planHashes | type) == "object"' "$plan" > /dev/null \
            || fail "the plan carries no per-company approval unit — re-plan with this build"
          [ "$(jq -r '.approval.approvalReady' "$plan")" = "true" ] \
            || fail "this plan is not appliable: its PLAN had failures or dependency exceptions. Resolve them, then re-plan and apply the clean plan."
          [ "$(jq -r '.approval.aggregateHash' "$plan")" = "$aggregate_hash" ] \
            || fail "the plan's approval unit does not match its own aggregateHash"
          jq -c '.approval' "$plan" > "$RUNNER_TEMP/f2-approved-plan.json"
          {
            echo "release_ref=$release_ref"
            echo "release_image=$release_image"
            echo "aggregate_hash=$aggregate_hash"
            echo "a5_evidence_hash=$a5_evidence_hash"
            echo "a5_query_catalog_hash=$(jq -r '.a5.queryCatalogHash' "$plan")"
          } >> "$GITHUB_OUTPUT"
          echo "Applying plan run $PLAN_RUN_ID for $environment @ $release_ref (aggregate $aggregate_hash)"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.plan.outputs.release_ref }}
          fetch-depth: 0
      - name: Re-verify environment-owned source ancestry
        env:
          RELEASE_REF: ${{ steps.plan.outputs.release_ref }}
        run: |
          set -euo pipefail
          branch=main
          [ "$DEPLOY_ENV" = "uat" ] && branch=develop
          test "$(git rev-parse HEAD)" = "$RELEASE_REF"
          git fetch origin "$branch" --force
          git merge-base --is-ancestor "$RELEASE_REF" "origin/$branch" || {
            echo "ERROR: approved commit is no longer reachable from origin/$branch for $DEPLOY_ENV" >&2
            exit 1
          }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: watchdog-bms-f2-apply-${{ github.run_id }}
      - name: Verify exact UAT controller policies before mutation
        if: inputs.environment == 'uat'
        run: bash infra/uat/verify-control-plane-policies.sh
      - name: Pin APPLY to the exact api-web build serving now
        env:
          RELEASE_REF: ${{ steps.plan.outputs.release_ref }}
        run: bash infra/prod-ecs-express/verify-serving-api-build.sh "$DEPLOY_ENV" "$RELEASE_REF"
      - name: Verify the approved release image
        env:
          RELEASE_REF: ${{ steps.plan.outputs.release_ref }}
          RELEASE_IMAGE: ${{ steps.plan.outputs.release_image }}
        run: |
          set -euo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker pull --platform linux/amd64 "$RELEASE_IMAGE"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$RELEASE_IMAGE")" = "$RELEASE_REF"
          signer_workflow=deploy-production.yml
          [ "$DEPLOY_ENV" = uat ] && signer_workflow=deploy-uat.yml
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/${signer_workflow}@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RELEASE_IMAGE" >/dev/null
      - name: Refresh the zero-write A5 precheck before the writer
        id: a5
        env:
          RELEASE_REF: ${{ steps.plan.outputs.release_ref }}
          RELEASE_IMAGE: ${{ steps.plan.outputs.release_image }}
          APPROVED_QUERY_CATALOG_HASH: ${{ steps.plan.outputs.a5_query_catalog_hash }}
        run: |
          set -euo pipefail
          mkdir -p f2-artifact
          bash infra/prod-ecs-express/run-release-task.sh "$RELEASE_IMAGE" "$RELEASE_REF" a5-ro \
            2>&1 | tee f2-artifact/a5-ro-fresh.log
          tr '\t' '\n' < f2-artifact/a5-ro-fresh.log \
            | awk '/^\{$/ && !seen {seen=1} seen {print} /^\}$/ && seen {exit}' \
            > f2-artifact/a5-readonly-evidence-fresh.json
          evidence=f2-artifact/a5-readonly-evidence-fresh.json
          jq -e --arg sha "$RELEASE_REF" --arg catalog "$APPROVED_QUERY_CATALOG_HASH" '
            .artifact == "a5-readonly-evidence"
            and .schemaVersion == 1
            and .targetEnvironment == "uat"
            and .sourceCommit == $sha
            and .readOnly == true
            and .queryCatalogHash == $catalog
            and .f2PrecheckReady == true
            and (.f2PrecheckBlockers | length) == 0
            and (.evidenceHash | type == "string" and test("^[0-9a-f]{64}$"))
          ' "$evidence" >/dev/null || {
            echo "ERROR: fresh A5 precheck is not clean or does not match the reviewed query catalog/SHA" >&2
            jq -r '.f2PrecheckBlockers[]? | "  - \(.)"' "$evidence" >&2 || true
            exit 1
          }
          computed_hash="$(jq -cSj 'del(.generatedAt,.evidenceHash)' "$evidence" | sha256sum | awk '{print $1}')"
          [ "$computed_hash" = "$(jq -r '.evidenceHash' "$evidence")" ] || {
            echo "ERROR: fresh A5 evidence hash does not match its canonical payload" >&2
            exit 1
          }
          echo "evidence_hash=$computed_hash" >> "$GITHUB_OUTPUT"
      - name: Re-pin APPLY after the fresh A5 precheck
        env:
          RELEASE_REF: ${{ steps.plan.outputs.release_ref }}
        run: bash infra/prod-ecs-express/verify-serving-api-build.sh "$DEPLOY_ENV" "$RELEASE_REF"
      - name: Apply the reviewed plan
        id: apply
        env:
          RELEASE_REF: ${{ steps.plan.outputs.release_ref }}
          RELEASE_IMAGE: ${{ steps.plan.outputs.release_image }}
          F2_APPROVED_HASH: ${{ steps.plan.outputs.aggregate_hash }}
        run: |
          set -euo pipefail
          mkdir -p f2-artifact
          cp "$RUNNER_TEMP/f2-plan/f2-plan.json" f2-artifact/approved-plan.json
          # The f2-apply MODE runs the normalizer CLI and nothing else — no migration, no sync
          # scripts. The task re-plans the estate read-only and halts with ZERO writes if the
          # recomputed aggregate differs from the reviewed artifact carried in here.
          F2_APPROVED_PLAN_JSON="$(cat "$RUNNER_TEMP/f2-approved-plan.json")" \
          bash infra/prod-ecs-express/run-release-task.sh "$RELEASE_IMAGE" "$RELEASE_REF" f2-apply \
            2>&1 | tee f2-artifact/f2-apply.log
      - name: Verify the estate independently
        if: always() && steps.apply.outcome != 'skipped'
        env:
          RELEASE_REF: ${{ steps.plan.outputs.release_ref }}
          RELEASE_IMAGE: ${{ steps.plan.outputs.release_image }}
        run: |
          set -euo pipefail
          mkdir -p f2-artifact
          bash infra/prod-ecs-express/verify-serving-api-build.sh "$DEPLOY_ENV" "$RELEASE_REF"
          # A fresh process reading fresh rows: every company COMPLETED at the current normalizer
          # version, the stored rows already the plan's fixed point, and grantOrigin=LEGACY present
          # on every effective-ON row of a grandfathered company. Non-zero exit fails this job.
          bash infra/prod-ecs-express/run-release-task.sh "$RELEASE_IMAGE" "$RELEASE_REF" f2-verify \
            2>&1 | tee f2-artifact/f2-verify.log
      - name: Re-check A5 and WHT after the writer
        id: final_a5
        if: always() && steps.apply.outcome != 'skipped'
        env:
          RELEASE_REF: ${{ steps.plan.outputs.release_ref }}
          RELEASE_IMAGE: ${{ steps.plan.outputs.release_image }}
          APPROVED_QUERY_CATALOG_HASH: ${{ steps.plan.outputs.a5_query_catalog_hash }}
        run: |
          set -euo pipefail
          mkdir -p f2-artifact
          bash infra/prod-ecs-express/verify-serving-api-build.sh "$DEPLOY_ENV" "$RELEASE_REF"
          bash infra/prod-ecs-express/run-release-task.sh "$RELEASE_IMAGE" "$RELEASE_REF" a5-ro \
            2>&1 | tee f2-artifact/a5-ro-final.log
          tr '\t' '\n' < f2-artifact/a5-ro-final.log \
            | awk '/^\{$/ && !seen {seen=1} seen {print} /^\}$/ && seen {exit}' \
            > f2-artifact/a5-readonly-evidence-final.json
          evidence=f2-artifact/a5-readonly-evidence-final.json
          jq -e --arg sha "$RELEASE_REF" --arg catalog "$APPROVED_QUERY_CATALOG_HASH" '
            .artifact == "a5-readonly-evidence"
            and .schemaVersion == 1
            and .targetEnvironment == "uat"
            and .sourceCommit == $sha
            and .readOnly == true
            and .queryCatalogHash == $catalog
            and .f2PrecheckReady == true
            and (.f2PrecheckBlockers | length) == 0
            and .launchHealth.wht50Bis.open == 0
            and (.evidenceHash | type == "string" and test("^[0-9a-f]{64}$"))
          ' "$evidence" >/dev/null || {
            echo "ERROR: final A5/WHT post-condition is not clean" >&2
            jq -r '.f2PrecheckBlockers[]? | "  - \(.)"' "$evidence" >&2 || true
            exit 1
          }
          computed_hash="$(jq -cSj 'del(.generatedAt,.evidenceHash)' "$evidence" | sha256sum | awk '{print $1}')"
          [ "$computed_hash" = "$(jq -r '.evidenceHash' "$evidence")" ] || {
            echo "ERROR: final A5 evidence hash does not match its canonical payload" >&2
            exit 1
          }
          echo "evidence_hash=$computed_hash" >> "$GITHUB_OUTPUT"
      - name: Summarize the apply and the verification
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## F2 apply + verify — ${DEPLOY_ENV}"
            echo
            echo "Plan run: ${{ inputs.plan_run_id }}"
            echo "Approved A5 evidence: \`${{ steps.plan.outputs.a5_evidence_hash }}\`"
            echo "Fresh A5 evidence: \`${{ steps.a5.outputs.evidence_hash }}\`"
            echo "Final A5/WHT evidence: \`${{ steps.final_a5.outputs.evidence_hash }}\`"
            echo
            echo '```'
            grep -E 'entitlement normalization: (mode|approvedHash|aggregateHash|total)' f2-artifact/f2-apply.log || echo "no apply lines captured"
            grep -E 'entitlement normalization: verify' f2-artifact/f2-verify.log || echo "no verify line captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: f2-apply-${{ inputs.environment }}
          path: f2-artifact/
          retention-days: 30
